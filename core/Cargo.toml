[package]
name = "createcalc-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Production planner for the Minecraft mod Create"

[lib]
name = "createcalc_core"

[[bin]]
name = "createcalc-import"
path = "src/bin/import.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true
toml = "0.8"
zip = { version = "2", default-features = false, features = ["deflate"] }
good_lp = { version = "1", default-features = false, features = ["microlp"] }
