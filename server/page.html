<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Production calculator for Create mod and Create addons</title>
<meta name="description" content="Production calculator for the Minecraft mod Create and Create addons: machines, stress, belts and materials from raw resources to the finished item.">
<style>
:root{--bg:#121417;--card:#1b1e23;--line:#2e3238;--line2:#3b4048;--text:#e4e6e9;--dim:#a3a8b0;--blue:#5ca6ee;--orange:#eda83c;--green:#6fd08a;--gold:#d9b65a;--red:#e07a6a}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:12px/1.35 "Segoe UI",system-ui,sans-serif;overflow:hidden}
button,input,select{font:inherit;color:inherit}
#canvas{position:fixed;inset:0;cursor:grab;touch-action:none;background:var(--bg)}
#canvas.pan{cursor:grabbing}
#world{position:absolute;left:0;top:0;width:1px;height:1px;transform-origin:0 0}
#edges{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible;pointer-events:none}
#labels{position:absolute;left:0;top:0;pointer-events:none}
.elabel{position:absolute;display:flex;flex-direction:column;align-items:center;transform:translate(-50%,-9px);color:#8f949b;font-size:10.5px;white-space:nowrap}
.elabel{pointer-events:auto;cursor:pointer}
.elabel span.t{color:var(--blue)}
.elabel span.warn,.note.warn{color:#d9a441}
.elabel span.n{margin-top:1px;padding:0 2px;background:var(--bg);border-radius:2px;line-height:13px}
.ic{display:inline-flex;align-items:center;justify-content:center;flex:none;border-radius:2px;font-weight:600;line-height:1;letter-spacing:-.02em;user-select:none}
.ic img{display:block;width:100%;height:100%;image-rendering:pixelated;pointer-events:none}
.node{position:absolute;width:260px;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:9px 10px 7px;cursor:pointer;user-select:none}
.node:active{cursor:grabbing}
.node:hover{border-color:var(--line2)}
.node>.mach:first-child{border-top:0;margin-top:0;padding-top:0}
.outs{border-top:1px solid var(--line);margin-top:6px;padding-top:4px}
.outs .lbl{color:var(--dim);font-size:11px;line-height:15px;margin-bottom:2px}
.outs .head+.head{margin-top:4px}
.far .outs .lbl{visibility:hidden}
.node.by{background:#17191c}
.node.by .head .t{color:#b4b8be;font-weight:500}
.node.by .head .r{color:#9ea3ab}
.node.goal{border-color:var(--gold);border-width:1.5px;padding:8.5px 9.5px 6.5px}
.node.sel{border-color:#9fb2c6}
.node.goal.sel{border-color:#f0d58a}
.head{display:flex;align-items:center;gap:9px}
.head>div{flex:1;min-width:0;display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.head .t{font-size:14px;font-weight:600;line-height:18px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.head .r{color:var(--blue);font-size:13px;line-height:18px;white-space:nowrap;flex:none}
.sub{margin-top:7px;font-size:11.5px;color:var(--dim);line-height:14px}
.sub.green{color:var(--green)}
.sub svg{vertical-align:-2px;margin-right:3px}
.mach{display:flex;align-items:center;gap:6px;border-top:1px solid var(--line);margin-top:7px;padding-top:6px;min-height:30px}
.mach+.mach{border-top:0;margin-top:0;padding-top:1px}
.mach .name{flex:1;min-width:0;font-size:13px;line-height:17px}
.mach .proc{display:block;color:var(--dim);font-size:11.5px;line-height:15px}
.mach .x{color:var(--orange);font-weight:600;font-size:17px;white-space:nowrap;text-align:right;line-height:20px}
.mach .x small{display:block;color:var(--dim);font-weight:400;font-size:11px;line-height:13px}
.rc{flex:none;align-self:stretch;background:none;border:0;padding:0 0 0 3px;color:var(--dim);font-size:12px;cursor:pointer}
.rc:hover{color:var(--text)}
.stats{display:grid;grid-template-columns:1fr auto;gap:1px 10px;border-top:1px solid var(--line);margin-top:6px;padding-top:5px;font-size:12px;line-height:17px;color:var(--text)}
.stats .r2{text-align:right}
.stats .own{color:var(--gold)}
.stats .muted{color:var(--dim)}
.stats .tight{color:#d9a441}
.stats .heat{color:var(--orange)}
.far .stats,.far .proc{visibility:hidden}
.far .head .t{font-size:18px}
.far .head .r{font-size:16px}
/* Fields */
.fld{display:flex;align-items:center;gap:6px;color:var(--dim)}
.inp{height:28px;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:0 7px;color:var(--text);outline:0}
.inp:focus{border-color:#5a6470}
input[type=number]{appearance:textfield}
input[type=number]::-webkit-inner-spin-button{display:none}
.drop{position:fixed;display:none;z-index:6;overflow:auto;background:var(--card);border:1px solid var(--line2);border-radius:6px;padding:3px;box-shadow:0 6px 18px rgba(0,0,0,.5);scrollbar-width:thin;scrollbar-color:var(--line2) transparent}
.drop::-webkit-scrollbar{width:6px}
.drop::-webkit-scrollbar-thumb{background:var(--line2);border-radius:3px}
.gtop{display:flex;align-items:stretch;gap:8px}
.gadd{display:flex;align-items:center;gap:6px;margin-top:8px}
#side .gadd #search{flex:1;width:auto;min-width:0}
#side .gadd #newPer{width:58px;flex:none}
#goalList{margin-top:6px}
#shareRow{margin-top:8px}
#shareRow[hidden]{display:none}
#side #shareUrl{display:block;width:100%;margin-top:6px}
#side #shareUrl[hidden]{display:none}
#goalList .row{gap:6px}
#goalList .gn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#side #goalList .gper{width:62px;height:24px;flex:none}
.drop div{display:flex;align-items:center;gap:8px;padding:4px 6px;border-radius:3px;cursor:pointer}
.drop div small{margin-left:auto;color:var(--dim);font-size:10px}
.drop div.on{background:#2a2e35}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.seg button{background:var(--bg);border:0;border-left:1px solid var(--line);height:26px;padding:0 10px;color:var(--dim);cursor:pointer}
.seg button:first-child{border-left:0}
.seg button.on{background:#2a2e35;color:var(--text)}
.chk{display:flex;align-items:center;gap:6px;color:var(--text);cursor:pointer}
.chk input{margin:0;accent-color:var(--orange)}
#totals{flex:1;min-width:0;min-height:40px;background:none;border:1px solid var(--line);border-radius:4px;padding:3px 8px;cursor:pointer;text-align:left}
#totals:hover,#totals.on{border-color:var(--line2);background:#22252b}
/* Before the first plan there is nothing to show or to open. */
#totals:empty{visibility:hidden}
#totals .su{display:flex;justify-content:space-between;gap:6px;font-weight:600;line-height:17px}
#totals .w{color:var(--red)}
#totals .more{display:block;color:var(--dim);font-size:11px;line-height:14px}
#totals .more span{white-space:nowrap}
#langBtn{flex:none;display:flex;align-items:center;justify-content:space-between;gap:6px;cursor:pointer;text-align:left}
#side #langBtn{width:150px}
#langBtn::after{content:"\25BE";color:var(--dim)}
#langCur{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#langList div{white-space:nowrap}
#recipeList{width:340px}
#recipeList div{align-items:flex-start}
#recipeList .rt{flex:1;min-width:0}
#recipeList .rk{display:block;color:var(--dim);font-size:10.5px}
#recipeList .ok{color:var(--green);margin-left:auto;padding-left:6px}
.rsel{display:flex;align-items:center;gap:6px;width:100%;height:24px;margin-top:6px;padding:0 6px;font-size:11.5px;cursor:pointer;text-align:left}
.rsel:hover{border-color:var(--line2)}
.rsel .rv{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rsel .ra{flex:none;color:var(--green);font-size:10.5px}
.rsel .rd{flex:none;color:var(--dim)}
.far .rsel{visibility:hidden}
#recipeList #recipeRows{display:block;padding:0;cursor:default}
#recipeList input{width:calc(100% - 6px);margin:3px;height:26px}
.rbtn{display:flex;align-items:center;justify-content:space-between;width:100%;text-align:left;cursor:pointer}
/* Panel */
#panel{position:fixed;right:0;top:0;bottom:0;width:340px;background:#17191d;border-left:1px solid var(--line);z-index:4;overflow:auto;padding:12px 14px 20px;display:none;scrollbar-width:none}
#panel::-webkit-scrollbar{display:none}
#panel.open{display:block}
#panel h2{font-size:12.5px;font-weight:600;margin:0}
#panel h3{font-size:10.5px;font-weight:400;color:var(--dim);margin:16px 0 5px}
.ph{display:flex;align-items:center;gap:9px;padding-right:24px;min-height:30px}
/* Fixed, so a long recipe list can always be closed. It goes away with the panel. */
#close{position:fixed;right:9px;top:8px;z-index:1;width:24px;height:24px;background:#17191d;border:0;border-radius:4px;color:var(--dim);cursor:pointer;font-size:15px}
#close:hover{color:var(--text)}
.row{display:flex;align-items:center;gap:7px;padding:2px 0;min-height:21px}
.row .v{margin-left:auto;white-space:nowrap;color:var(--blue)}
.row .v.p{color:var(--text)}
.row .d{color:var(--dim);font-size:10.5px}
#panel select,#panel .inp{width:100%}
#panel select{height:28px;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:0 3px}
#panel select option{background:var(--card)}
.btn{height:28px;background:#22252b;border:1px solid var(--line2);border-radius:4px;padding:0 11px;cursor:pointer}
.btn:hover:not(:disabled){background:#2c3037}
.btn:disabled{opacity:.45;cursor:default}
.btns{display:flex;gap:7px;flex-wrap:wrap;margin-top:16px}
.note{color:var(--dim);font-size:10.5px;margin-top:4px}
.warn{color:var(--red);font-size:11px;margin:3px 0}
/* Bottom */
#side{position:fixed;left:12px;top:12px;width:290px;max-height:calc(100vh - 74px);overflow:auto;background:#17191d;border:1px solid var(--line2);border-radius:8px;z-index:4}
#side{scrollbar-width:none}
#side::-webkit-scrollbar{display:none}
#side details+details{border-top:1px solid var(--line)}
#side summary{list-style:none;cursor:pointer;padding:10px 12px;font-size:13px;font-weight:600;display:flex;justify-content:space-between;align-items:center;user-select:none}
#side summary::-webkit-details-marker{display:none}
#side summary::after{content:"\25BE";color:var(--dim)}
#side details:not([open]) summary::after{content:"\25B8"}
#side summary:hover{background:#1f2227}
#side .sb{padding:0 12px 12px}
#side h3{font-size:11px;font-weight:400;color:var(--dim);margin:10px 0 4px}
#side .line{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:30px;font-size:12px}
#side .chk.line{justify-content:flex-start}
#side .inp{width:70px}
#side .seg button{padding:0 8px}
.btn.file{display:inline-flex;align-items:center;font-size:12px}
.btn.file input{display:none}
.inp.wide{width:100%;margin-top:8px}
.seg.wide{display:flex;margin-top:8px}
#mode button{flex:1 1 auto;white-space:nowrap}
.seg.wide button{flex:1;padding:0 4px;font-size:11.5px}
.rcp{border:1px solid var(--line);border-radius:6px;padding:6px 8px;margin-top:6px;background:var(--card)}
.rcp[hidden]{display:none}
.rl{display:flex;justify-content:space-between;align-items:center;min-height:24px;gap:6px}
.rt{min-width:0}
.rn{font-weight:600;font-size:12.5px}
.rk{display:block}
#ask{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:20}
#ask[hidden]{display:none}
#askBox{width:420px;max-width:calc(100vw - 32px);max-height:calc(100vh - 80px);overflow:auto;background:#17191d;border:1px solid var(--line2);border-radius:8px;padding:14px 16px}
#askBox h2{font-size:14px;margin:0 0 4px}
#askBox h3{font-size:11px;font-weight:400;color:var(--dim);margin:12px 0 4px}
#askBox .btns{justify-content:flex-end}
#askBox p{margin:6px 0 0;line-height:1.45}
#askBox a{color:var(--blue)}
#askBox .links{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:12px}
.btn.yes{background:#2d4a33;border-color:#3f6b49}
.rf{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:3px}
.rf .ar{color:var(--dim)}
.chip{display:inline-flex;align-items:center;gap:3px;font-size:11.5px}
.go{cursor:pointer}
.chip.go:hover,.row.go:hover{color:var(--blue)}
.btn.sm{height:22px;padding:0 7px;font-size:11px}
.qty{display:flex;gap:6px;flex-wrap:wrap}
.qty .inp{flex:1;min-width:120px}
.qty .btn.on{border-color:var(--gold);color:var(--gold)}
.rc.x{align-self:center;font-size:14px;padding:0 0 0 6px}
#tip{position:fixed;z-index:30;max-width:290px;background:#22252b;border:1px solid var(--line2);border-radius:6px;padding:7px 9px;font-size:12px;line-height:1.4;color:var(--text);pointer-events:none;box-shadow:0 4px 14px rgba(0,0,0,.45)}
#tip[hidden]{display:none}
#side .line[data-tip]:hover{background:#1f2227}
/* Right of the sidebar: nothing else stands there, so a long error can wrap freely. */
#status{position:fixed;left:314px;top:12px;color:var(--dim);z-index:5;max-width:calc(100vw - 326px)}
#status.err{color:var(--red);background:#17191d;border:1px solid var(--line);border-radius:4px;padding:3px 7px}
#panel.open~#status{max-width:max(140px,calc(100vw - 666px))}
/* The sidebar leaves 62px under itself, this row fits in them. */
#foot{position:fixed;left:12px;bottom:10px;display:flex;gap:4px;z-index:3}
#foot a{display:inline-flex;align-items:center;gap:5px;text-decoration:none}
#foot a,#foot button{padding:0 8px}
#zoom{position:fixed;right:12px;bottom:10px;display:flex;gap:4px;z-index:5;align-items:center;color:var(--dim)}
#zoom button,#zPct,#foot a,#foot button{height:24px;min-width:24px;background:#17191d;border:1px solid var(--line);border-radius:4px;color:var(--dim)}
#zoom button,#foot a,#foot button{cursor:pointer}
#zoom button:hover,#foot a:hover,#foot button:hover{color:var(--text)}
#zPct{min-width:42px;line-height:22px;text-align:center}
/* The panel takes the right edge, so the control stands beside it. With no room there it stays reachable on top of the panel. */
#panel.open~#zoom{right:min(352px,calc(100vw - 172px))}
/* Too narrow to share the bottom row with #foot: one row higher, still under the sidebar. */
@media (max-width:680px){#panel.open~#zoom{bottom:36px}}
</style>
</head>
<body>
<div id="canvas"><div id="world"><svg id="edges"></svg><div id="labels"></div><div id="nodes"></div></div></div>
<div id="ask" hidden><div id="askBox" role="dialog" aria-modal="true"></div></div>
<aside id="side">
  <details id="sGoal" open><summary data-t="targets"></summary><div class="sb">
    <div class="gtop"><label class="fld" data-tip="tipRpm">RPM <input id="rpm" class="inp" type="number" min="1" step="any" style="width:58px"></label><button id="totals" data-t-title="stressBuildings"></button></div>
    <div class="seg wide" id="mode"><button data-v="normal" data-t="modeNormal" data-tip="tipNormal"></button><button data-v="full_auto" data-t="modeAuto" data-tip="tipAuto"></button></div>
    <div class="gadd"><input id="search" class="inp" data-t-ph="addItem" data-t-aria="addItem" autocomplete="off" spellcheck="false"><input id="newPer" class="inp" type="number" min="0.01" step="any" value="60" data-t-title="newRate" data-t-aria="newRate"><span class="d" data-t="perMin"></span></div>
    <div id="goalList"></div>
    <div class="btns" id="shareRow"><button class="btn" id="bShare" data-t="share" data-tip="tipShare"></button></div>
    <input id="shareUrl" class="inp" readonly hidden data-t-aria="share">
    <div class="note" id="shareNote"></div>
  </div></details>
  <details id="sBr" open hidden><summary data-t="branches"></summary><div class="sb" id="brBody"></div></details>
  <details id="sMat" open hidden><summary data-t="materials"></summary><div class="sb">
    <h3 data-t="whatToBuild"></h3><div id="matBuild"></div>
    <h3 data-t="buildMaterials"></h3><div id="matRaw"></div>
    <div class="note warn" id="matFunnelNote" data-t="funnelForced" hidden></div>
    <div class="note" data-t="materialsNote"></div>
    <div class="btns"><button class="btn" id="bCopy" data-t="copy"></button></div><div class="note" id="bNote"></div>
  </div></details>
  <details id="sSet"><summary data-t="settings"></summary><div class="sb">
    <div class="fld line"><span id="langLabel" data-t="language"></span><button id="langBtn" class="inp" type="button" aria-haspopup="listbox" aria-expanded="false" aria-controls="langList" aria-labelledby="langLabel langCur"><span id="langCur"></span></button></div>
    <h3 data-t="scheme"></h3>
    <label class="chk line" data-tip="tipHeat"><input id="heat" type="checkbox"> <span data-t="heat"></span></label>
    <label class="chk line" data-tip="tipAsk"><input id="cAsk" type="checkbox"> <span data-t="askFirst"></span></label>
    <label class="fld line" data-tip="tipBelt"><span data-t="beltRpm"></span><input id="belt" class="inp" type="number" min="1" step="any"></label>
    <div class="fld line" data-tip="tipBatch"><span data-t="batch"></span><div class="seg" id="dBatch"></div></div>
    <div class="fld line" data-tip="tipStack"><span data-t="beltStack"></span><div class="seg" id="dStack"></div></div>
    <div class="fld line" data-tip="tipFunnel"><span data-t="funnel"></span><div class="seg" id="dFunnel"><button data-v="andesite" data-t="funnelAndesite"></button><button data-v="brass" data-t="funnelBrass"></button></div></div>
    <div class="note warn" id="setFunnelNote" data-t="funnelForced" hidden></div>
    <label class="fld line" data-tip="tipSails"><span data-t="sails"></span><input id="cSails" class="inp" type="number" min="8" step="8"></label>
    <h3 data-t="createConfig"></h3>
    <label class="fld line" data-tip="tipMax"><span data-t="maxRpm"></span><input id="cMax" class="inp" type="number" min="1" step="any"></label>
    <label class="fld line" data-tip="tipFan"><span data-t="fanTime"></span><input id="cFan" class="inp" type="number" min="1" step="1"></label>
    <label class="chk line" data-tip="tipBulkPress"><input id="cBulkPress" type="checkbox"> <span data-t="bulkPress"></span></label>
    <label class="chk line" data-tip="tipBulkCut"><input id="cBulkCut" type="checkbox"> <span data-t="bulkCut"></span></label>
    <label class="chk line" data-tip="tipSquare"><input id="cSquare" type="checkbox"> <span data-t="square"></span></label>
    <label class="chk line" data-tip="tipShapeless"><input id="cShapeless" type="checkbox"> <span data-t="shapeless"></span></label>
    <label class="chk line" data-tip="tipCrafter"><input id="cCrafter" type="checkbox"> <span data-t="crafter"></span></label>
    <label class="chk line" data-tip="tipStone"><input id="cStone" type="checkbox"> <span data-t="stonecut"></span></label>
    <div class="btns"><label class="btn file" data-tip="tipToml"><span data-t="loadToml"></span><input id="cFile" type="file" accept=".toml"></label><button class="btn" id="cReset" data-t="reset" data-tip="tipReset"></button></div>
    <div class="note" id="cNote"></div>
  </div></details>
</aside>
<aside id="panel"><button id="close" data-t-aria="close">&times;</button><div id="panelBody"></div></aside>
<div id="sugg" class="drop"></div>
<div id="langList" class="drop" role="listbox"></div>
<div id="recipeList" class="drop" role="listbox"></div>
<div id="zoom"><button id="zOut" data-t-aria="zoomOut">&minus;</button><span id="zPct"></span><button id="zIn" data-t-aria="zoomIn">+</button><button id="zFit" data-t="fit"></button></div>
<div id="foot"><a href="https://github.com/MekoNix/CreateCalculated" target="_blank" rel="noopener"><svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg><span data-t="github"></span></a><button id="aboutBtn" data-t="about"></button></div>
<div id="tip" hidden></div>
<div id="status"></div>
<script>
'use strict';
// Opened from the server it talks to that server, opened as a file it looks for a local one.
const API = location.protocol === 'file:' ? 'http://127.0.0.1:3000' : location.origin;
const W = 260, GAP_X = 104, GAP_Y = 30, DUMMY_H = 40;
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function buildGraph(p){

  const edges = [];

    if (!src) continue;
    const toEnd = e.to.startsWith('surplus:');
    // Every output the scheme does use is listed on the recipe's card.
    if (!toEnd && src.type === 'recipe' && e.res !== src.res) {

      if (!ref) continue;
      const bary = new Map(cols[l].map(v => {
        const src = v.src ? [v.src] : v.nb.filter(([o]) => ref.includes(o)).map(([o]) => o);
        const list = src.filter(o => ref.includes(o));
        return [v, list.length ? list.reduce((s, o) => s + o.pos, 0) / list.length : v.pos];
      }));
      cols[l].sort((a, b) => bary.get(a) - bary.get(b));
      surplusLast(cols[l]);
      number(cols[l]);
    }
    const x = crossings();
    if (x < bestX) { bestX = x; best = cols.map(c => c.slice()); }
  }
  best.forEach((c, i) => { cols[i] = c; surplusLast(c); number(c); });

  // Y: neighbours pull, the main chain anchors at zero, each column keeps its order and gaps.
  const place = (col, want) => {
    let off = 0;
    const blocks = [];
    col.forEach((v, i) => {
      if (i) off += (col[i - 1].h + v.h) / 2 + (v.node && isEnd(v.node) ? 24 : GAP_Y);
      let b = {w:want[i][1], z:want[i][0] - off, n:[{v, off}]};
      while (blocks.length && blocks[blocks.length - 1].z >= b.z) {
        const a = blocks.pop();
        b = {w:a.w + b.w, z:(a.z*a.w + b.z*b.w) / (a.w + b.w), n:a.n.concat(b.n)};
      }
      blocks.push(b);
    });
    for (const b of blocks) for (const {v, off} of b.n) v.y = b.z + off;
  };
  cols.forEach(col => { let y = 0; col.forEach(v => { v.y = y; y += v.h + GAP_Y; }); });
  for (let it = 0; it < 40; it++) {
    const order = it % 2 ? cols : cols.slice().reverse();
    for (const col of order) {
      place(col, col.map(v => {
        if (v.node && chain.has(v.id)) return [0, 1000];
        if (v.src) return [v.src.y + v.src.h / 2 + 34 + v.h / 2, 6];
        if (!v.nb.length) return [v.y, .1];
        let s = 0, w = 0;
        for (const [o, k] of v.nb) { s += o.y*k; w += k; }
        return [s / w, w];
      }));
    }
  }

  // Coordinates: y here is the centre of the vertex.
  let x = 0;
  cols.forEach(col => {
    for (const v of col) {
      v.x = x;
      if (v.node) { v.node.x = x; v.node.y = v.y - v.h / 2; }
    }
    x += W + GAP_X;
  });
  for (const e of edges) e.via = e.via.map(d => ({x:d.x + W / 2, y:d.y}));
  for (const n of nodes.values()) {
    const p = pins.get(n.id);
    if (p) { n.x = p.x; n.y = p.y; }
  }
}

function machineRows(n, kind){

// RPM, how full the machines are and stress, the same for recipes and generators.

function beltPerFan(l){

function statsRows(loads, ownRpm, extraRight){

function renderNodes(){

function renderPositions(){

function bez(p0, c1, c2, p3, t){
  const u = 1 - t;
  return [u*u*u*p0[0] + 3*u*u*t*c1[0] + 3*u*t*t*c2[0] + t*t*t*p3[0], u*u*u*p0[1] + 3*u*u*t*c1[1] + 3*u*t*t*c2[1] + t*t*t*p3[1]];
}
function segments(points, shift){
  const out = [];
  for (let i = 0; i + 1 < points.length; i++) {
    const a = points[i], b = points[i + 1];
    const dx = b[0] > a[0] ? Math.max(36, (b[0] - a[0]) * .5) : 70;
    out.push([a, [a[0] + dx, a[1] + shift], [b[0] - dx, b[1] + shift], b]);
  }
  return out;
}
function polyline(segs){
  const pts = [];
  for (const s of segs) for (let i = 0; i <= 16; i++) pts.push(bez(s[0], s[1], s[2], s[3], i / 16));
  return pts;
}
const insideCard = (p, n, m) => p[0] > n.x - m && p[0] < n.x + W + m && p[1] > n.y - m && p[1] < n.y + n.h + m;
function renderEdges(){
  const nodes = [...G.nodes.values()], paths = [], arrows = [], labels = [], placed = [];
  const parallel = new Map();
  const list = G.edges.slice().sort((a, b) => (b.side - a.side) || (volume(a) - volume(b)));
  for (const e of list) {
    const key = e.from + '>' + e.to, idx = parallel.get(key) || 0;
    parallel.set(key, idx + 1);
    const a = G.nodes.get(e.from), b = G.nodes.get(e.to);
    const start = [a.x + W, a.y + a.h / 2], tip = [b.x, b.y + b.h / 2];
    const heft = Math.log10(volume(e) + 1);
    const len = e.side ? 11 : Math.min(21, 13 + heft * 2.4);
    const end = [tip[0] - len * .7, tip[1]];
    const shift = idx ? (idx % 2 ? 1 : -1) * Math.ceil(idx / 2) * 26 : 0;
    let segs = segments([start, end], shift);
    let pts = polyline(segs);
    const others = nodes.filter(n => n !== a && n !== b);
    if (e.via.length && pts.some(p => others.some(n => insideCard(p, n, 6)))) {
      segs = segments([start, ...e.via.map(v => [v.x, v.y]), end], shift);
      pts = polyline(segs);
    }
    const color = tint(iconColor(e.res));
    const width = e.side ? 1.4 : Math.min(3, 1.5 + heft * .55);
    const d = `M${segs[0][0][0]} ${segs[0][0][1]}` + segs.map(s => `C${s[1][0]} ${s[1][1]} ${s[2][0]} ${s[2][1]} ${s[3][0]} ${s[3][1]}`).join('');
    paths.push(`<path d="${d}" fill="none" stroke="${color}" stroke-width="${width.toFixed(2)}"${e.side ? ' stroke-dasharray="5 4"' : ''}/>`);
    const hw = len * .56;
    arrows.push(`<polygon points="${tip[0]},${tip[1]} ${tip[0] - len},${tip[1] - hw} ${tip[0] - len},${tip[1] + hw}" fill="${color}"/>`);
    // The label takes the first free spot around the middle of the curve.
    let spot = pts[Math.floor(pts.length / 2)];
    for (const t of [.5, .42, .58, .34, .66, .26, .74, .18, .82]) {
      const p = pts[Math.floor(pts.length * t)];
      const clear = !nodes.some(n => insideCard([p[0], p[1] + 8], n, 26)) && !placed.some(q => Math.abs(q[0] - p[0]) < 62 && Math.abs(q[1] - p[1]) < 36);
      if (clear) { spot = p; break; }
    }
    placed.push(spot);
    const txt = fmt(e.per_minute) + (unit(e.res) ? ' ' + unit(e.res) : '') + (e.side ? t('byProductEdge') : '');
    const tr = e.transport;
    const extra = tr ? [tr.stack > 1 ? t('perStack', tr.stack) : '', tr.belts > 1 ? t('beltsN', tr.belts) : '', S.belt ? fmt(tr.belt_rpm) + ' RPM' : ''].filter(Boolean).join(', ') : '';
    labels.push(`<div class="elabel" data-edge="${esc(edgeKey(e))}" style="left:${spot[0]}px;top:${spot[1]}px" title="${esc(nameOf(e.res))}">${itemIcon(e.res, 17)}<span class="n">${txt}</span>${extra ? `<span class="n t${tr.needs_buffer ? ' warn' : ''}">${extra}</span>` : ''}</div>`);
  }
  $('edges').innerHTML = paths.join('') + arrows.join('');
  $('labels').innerHTML = labels.join('');
}
function applyView(){

function fit(){
  const ns = [...G.nodes.values()];
  if (!ns.length) return;
  const x0 = Math.min(...ns.map(n => n.x)), x1 = Math.max(...ns.map(n => n.x + W));
  const y0 = Math.min(...ns.map(n => n.y)), y1 = Math.max(...ns.map(n => n.y + n.h));
  // The floating sidebar covers the left edge, so the graph is fitted beside it.
  const left = $('side').offsetWidth + 24, areaW = innerWidth - left - (panel ? 340 : 0), areaH = innerHeight;
  const pad = 36;
  const k = Math.max(.12, Math.min(1, (areaW - pad*2) / (x1 - x0), (areaH - pad*2) / (y1 - y0)));
  view = {k, x:left + (areaW - (x1 - x0)*k) / 2 - x0*k, y:(areaH - (y1 - y0)*k) / 2 - y0*k};
  applyView();
}
function zoomAt(cx, cy, factor){
  const k = Math.max(.12, Math.min(2.5, view.k * factor));
  view.x = cx - (cx - view.x) * k / view.k;
  view.y = cy - (cy - view.y) * k / view.k;
  view.k = k;
  applyView();
}

// What a change would do to the raw resources and the stress, compared with the current plan.
function planDiff(before, after){

    return map;
  };
  const was = sources(before), now = sources(after);
  const added = [...now].filter(([r]) => !was.has(r));
  const changed = [...now].filter(([r, v]) => was.has(r) && Math.abs(v - was.get(r)) > 1e-6).map(([r, v]) => [r, was.get(r), v]);
  const gone = [...was].filter(([r]) => !now.has(r));
  return {added, changed, gone, suBefore:before.total_su, suAfter:after.total_su, any:added.length + changed.length + gone.length > 0 || Math.abs(before.total_su - after.total_su) > 1e-6};
}

}
