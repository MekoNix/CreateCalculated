<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Калькулятор Create: схема</title>
<style>
:root{--bg:#24323f;--grid:#2b3a48;--grid2:#314251;--ln:#8599ac;--ln2:#5f7386;--tx:#cdd6de;--dim:#93a4b3;--ac:#c9b98c;--mono:ui-monospace,Consolas,"DejaVu Sans Mono",Menlo,monospace}
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--bg);color:var(--tx);font:12px/17px var(--mono)}
#box{position:fixed;inset:0;overflow:auto}#wrap{position:relative}
svg{display:block}svg text{font:11px var(--mono);fill:var(--tx)}
.gn{cursor:pointer}.gn rect,.gn path{fill:var(--bg);stroke:var(--ln);stroke-width:1}
.gn .sub{fill:var(--dim);font-size:10.5px}.gn .tag{fill:var(--dim);font-size:10px}
.gn line{stroke:var(--ln);stroke-width:1}
.residue rect{stroke:var(--ln2);stroke-dasharray:6 3}.residue text{fill:var(--dim)}
.stock path.cut{fill:none}
.target rect{stroke:var(--ac)}.target text{fill:var(--ac)}
.gn.sel rect,.gn.sel path:not(.cut){stroke:var(--ac);stroke-width:1.5}
.edge{fill:none;stroke:var(--ln);stroke-width:.8}.edge.side{stroke:var(--ln2);stroke-dasharray:6 3}
.tick{stroke:var(--ln);stroke-width:.8}.tick.side{stroke:var(--ln2)}.et{font-size:10.5px;fill:var(--tx)}.et.side{fill:var(--dim)}
.arrow{fill:var(--ln)}.leader{stroke:var(--ac);stroke-width:.8;stroke-dasharray:2 3;fill:none}
.pn{position:fixed;background:var(--bg);border:1px solid var(--ln2);z-index:2}
.pn h2{margin:0;padding:2px 8px;font-size:11px;font-weight:normal;color:var(--dim);border-bottom:1px solid var(--ln2)}
#spec{top:10px;left:10px;right:10px;display:flex;flex-wrap:wrap}
#spec label{display:flex;align-items:center;gap:6px;padding:4px 10px;border-right:1px solid var(--ln2);color:var(--dim)}
#spec .ttl{padding:4px 10px;border-right:1px solid var(--ln2);color:var(--tx)}
input,select{background:var(--bg);color:var(--tx);border:0;border-bottom:1px solid var(--ln);font:12px var(--mono);padding:0 2px;height:20px;border-radius:0}
select option{background:var(--bg)}input[type=number]{width:60px}input[type=checkbox]{accent-color:var(--ln);height:auto;margin:0}
input[type=range]{width:110px;padding:0;border:0;accent-color:var(--ln)}
input:focus,select:focus{outline:1px solid var(--ac);outline-offset:1px}
#stamp{right:10px;bottom:10px;width:320px}
table{border-collapse:collapse;width:100%}td{border-top:1px solid var(--grid2);padding:1px 8px}tr:first-child td{border-top:0}
td:first-child{color:var(--dim)}td.n{text-align:right;white-space:nowrap}
#bld{left:10px;bottom:10px;width:300px;max-height:45vh;overflow:auto}
.line{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:2px 8px;border-bottom:1px solid var(--grid2);color:var(--dim)}
.line select{min-width:0;max-width:180px}
#res{left:320px;bottom:10px;width:260px;max-height:45vh;overflow:auto}
#call{position:absolute;width:300px;background:var(--bg);border:1px solid var(--ac);z-index:1}
#call h3{margin:0;padding:3px 8px;font-size:12px;font-weight:normal;color:var(--ac);border-bottom:1px solid var(--ln2);display:flex;justify-content:space-between;gap:8px}
#call button.x{background:none;border:0;color:var(--dim);font:12px var(--mono);cursor:pointer;padding:0}
#call button.x:hover{color:var(--tx)}
#call .id{padding:2px 8px;color:var(--dim);font-size:10.5px;overflow-wrap:anywhere}
#call .line select{max-width:190px}
.btns button{background:none;color:var(--tx);border:1px solid var(--ln2);border-left-width:0;font:12px var(--mono);min-width:30px;height:20px;cursor:pointer}
.btns button:first-child{border-left-width:1px}.btns button.on{border-color:var(--ac);border-left-width:1px;color:var(--ac)}
@media(max-width:900px){#res{display:none}#bld{width:46vw}#stamp{width:50vw}}
</style>
</head>
<body>
<div id="box"><div id="wrap"></div></div>
<div class="pn" id="spec">
  <div class="ttl">Create: схема производства</div>
  <label>Позиция<select data-set="target"></select></label>
  <label>Выпуск<input type="number" min="0" step="any" value="60" data-set="rate">/мин</label>
  <label>RPM схемы<input type="number" min="1" max="256" value="256" data-set="rpm"><input type="range" min="1" max="256" value="256" data-set="rpm"></label>
  <label>Предел<input type="number" min="1" max="512" value="256" data-set="maxRpm"></label>
  <label>Масштаб<select data-set="zoom"><option value="auto">авто</option><option value="1">1:1</option><option value=".75">3:4</option><option value=".5">1:2</option></select></label>
</div>
<div class="pn" id="bld"><h2>Здания</h2>
  <div class="line"><span>Источник</span><select data-set="source"></select></div>
  <div class="line"><span>RPM источника</span><input type="number" min="1" max="256" value="8" data-set="srcRpm"></div>
  <table id="src"></table>
</div>
<div class="pn" id="res"><h2>Остатки, /мин</h2><table id="restb"></table><h2 style="border-top:1px solid var(--ln2)">Зачтено из побочных, /мин</h2><table id="cred"></table></div>
<div class="pn" id="stamp"><h2>Нагрузка</h2><table id="load"></table>
  <div class="line" style="border-bottom:0;border-top:1px solid var(--grid2)"><label style="display:flex;gap:6px;align-items:center"><input type="checkbox" checked data-set="heat">Нагрев</label><select data-set="fuel" id="fuelsel"></select></div>
</div>
<script>
'use strict';
/* ---- Данные: id рецепта = путь в data/create/recipe JAR. Одинаково во всех трёх мокапах. ---- */
const ITEMS={ // id: [название, код, короткая подпись для рёбер]
precision_mechanism:['Механизм точности','PMEC','Мех. точности'],golden_sheet:['Золотой лист','GSHT','Зол. лист'],
brass_ingot:['Латунный слиток','BRAS','Латунь'],andesite_alloy:['Андезитовый сплав','ANDA','Анд. сплав'],
cogwheel:['Шестерня','COG','Шестерня'],large_cogwheel:['Большая шестерня','LCOG','Бол. шестерня'],shaft:['Вал','SHFT','Вал'],
iron_ingot:['Железный слиток','FEIN','Жел. слиток'],gold_ingot:['Золотой слиток','AUIN','Зол. слиток'],
copper_ingot:['Медный слиток','CUIN','Мед. слиток'],zinc_ingot:['Цинковый слиток','ZNIN','Цинк. слиток'],
iron_nugget:['Кусочек железа','FENG','Куск. железа'],gold_nugget:['Кусочек золота','AUNG','Куск. золота'],
copper_nugget:['Кусочек меди','CUNG','Куск. меди'],zinc_nugget:['Кусочек цинка','ZNNG','Куск. цинка'],
crushed_raw_iron:['Дроблёное рудное железо','CRFE','Дробл. железо'],crushed_raw_gold:['Дроблёное рудное золото','CRAU','Дробл. золото'],
crushed_raw_copper:['Дроблёная рудная медь','CRCU','Дробл. медь'],crushed_raw_zinc:['Дроблёный рудный цинк','CRZN','Дробл. цинк'],
raw_iron:['Рудное железо','RAWF','Руд. железо'],raw_gold:['Рудное золото','RAWA','Руд. золото'],
raw_copper:['Рудная медь','RAWC','Руд. медь'],raw_zinc:['Рудный цинк','RAWZ','Руд. цинк'],
andesite:['Андезит','ANDS','Андезит'],planks:['Доски','PLNK','Доски'],cobblestone:['Булыжник','COBL','Булыжник'],
gravel:['Гравий','GRVL','Гравий'],flint:['Кремень','FLNT','Кремень'],experience_nugget:['Кусочек опыта','XP','Куск. опыта'],
redstone:['Редстоун','RDST','Редстоун'],gunpowder:['Порох','GUNP','Порох'],clay_ball:['Комок глины','CLAY','Глина'],
quartz:['Кварц','QRTZ','Кварц'],clock:['Часы','CLCK','Часы']};
const TARGETS=['precision_mechanism','brass_ingot','andesite_alloy','golden_sheet','large_cogwheel','cogwheel','shaft','gold_ingot','zinc_ingot','iron_nugget','zinc_nugget','flint'];
const R=(id,m,l,inp,out,x)=>Object.assign({id,m,l,in:inp,out},x||{});
const RECIPES=[
R('sequenced_assembly/precision_mechanism','deployer','Последовательная сборка, 5 циклов',{golden_sheet:1,cogwheel:5,large_cogwheel:5,iron_nugget:5},
  {precision_mechanism:120/150,golden_sheet:8/150,andesite_alloy:8/150,cogwheel:5/150,gold_nugget:3/150,shaft:2/150,crushed_raw_gold:2/150,iron_ingot:1/150,clock:1/150},{seq:{loops:5,steps:3}}),
R('pressing/gold_ingot','press','Пресс: из слитка',{gold_ingot:1},{golden_sheet:1}),
R('mixing/brass_ingot','mixer','Миксер, нагрев',{copper_ingot:1,zinc_ingot:1},{brass_ingot:2},{heat:'heated'}),
R('mixing/andesite_alloy','mixer','Миксер: андезит + железо',{andesite:1,iron_nugget:1},{andesite_alloy:1}),
R('mixing/andesite_alloy_from_zinc','mixer','Миксер: андезит + цинк',{andesite:1,zinc_nugget:1},{andesite_alloy:1}),
R('crafting/materials/andesite_alloy','crafter','Крафтер: 2 андезита + 2 железа',{andesite:2,iron_nugget:2},{andesite_alloy:1}),
R('crafting/materials/andesite_alloy_from_zinc','crafter','Крафтер: 2 андезита + 2 цинка',{andesite:2,zinc_nugget:2},{andesite_alloy:1}),
R('cutting/andesite_alloy','saw','Пила: 6 валов из сплава',{andesite_alloy:1},{shaft:6},{t:200}),
R('crafting/kinetics/shaft','crafter','Крафтер: 8 валов из 2 сплавов',{andesite_alloy:2},{shaft:8}),
R('deploying/cogwheel','deployer','Деплоер: вал + доска',{shaft:1,planks:1},{cogwheel:1}),
R('crafting/kinetics/cogwheel','crafter','Крафтер: вал + доска',{shaft:1,planks:1},{cogwheel:1}),
R('deploying/large_cogwheel','deployer','Деплоер: шестерня + доска',{cogwheel:1,planks:1},{large_cogwheel:1}),
R('crafting/kinetics/large_cogwheel_from_little','crafter','Крафтер: шестерня + доска',{cogwheel:1,planks:1},{large_cogwheel:1}),
R('crafting/kinetics/large_cogwheel','crafter','Крафтер: вал + 2 доски',{shaft:1,planks:2},{large_cogwheel:1}),
R('crushing/raw_iron','crusher','Дробление',{raw_iron:1},{crushed_raw_iron:1,experience_nugget:.75},{t:400}),
R('crushing/raw_gold','crusher','Дробление',{raw_gold:1},{crushed_raw_gold:1,experience_nugget:1.5},{t:400}),
R('crushing/raw_copper','crusher','Дробление',{raw_copper:1},{crushed_raw_copper:1,experience_nugget:.75},{t:400}),
R('crushing/raw_zinc','crusher','Дробление',{raw_zinc:1},{crushed_raw_zinc:1,experience_nugget:.75},{t:400}),
R('splashing/crushed_raw_iron','fan','Промывка',{crushed_raw_iron:1},{iron_nugget:9,redstone:.75}),
R('splashing/crushed_raw_gold','fan','Промывка',{crushed_raw_gold:1},{gold_nugget:9,quartz:.5}),
R('splashing/crushed_raw_copper','fan','Промывка',{crushed_raw_copper:1},{copper_nugget:9,clay_ball:.5}),
R('splashing/crushed_raw_zinc','fan','Промывка',{crushed_raw_zinc:1},{zinc_nugget:9,gunpowder:.25}),
R('blasting/iron_ingot_from_crushed','fan','Плавка дроблёного',{crushed_raw_iron:1},{iron_ingot:1}),
R('blasting/gold_ingot_from_crushed','fan','Плавка дроблёного',{crushed_raw_gold:1},{gold_ingot:1}),
R('blasting/copper_ingot_from_crushed','fan','Плавка дроблёного',{crushed_raw_copper:1},{copper_ingot:1}),
R('blasting/zinc_ingot_from_raw_ore','fan','Плавка сырой руды',{raw_zinc:1},{zinc_ingot:1}),
R('blasting/zinc_ingot_from_crushed','fan','Плавка дроблёного',{crushed_raw_zinc:1},{zinc_ingot:1}),
R('crafting/materials/copper_ingot','crafter','Крафтер: 9 кусочков',{copper_nugget:9},{copper_ingot:1}),
R('crafting/materials/zinc_ingot_from_compacting','crafter','Крафтер: 9 кусочков',{zinc_nugget:9},{zinc_ingot:1}),
R('milling/cobblestone','mill','Жернова',{cobblestone:1},{gravel:1},{t:250}),
R('milling/gravel','mill','Жернова',{gravel:1},{flint:1},{t:250})];
const MACHINES={press:{n:'Пресс',c:'PRS',su:8},mixer:{n:'Миксер',c:'MIX',su:4},mill:{n:'Жернова',c:'MLS',su:4},saw:{n:'Пила',c:'SAW',su:4},
deployer:{n:'Деплоер',c:'DPL',su:4},spout:{n:'Спаут',c:'SPT',su:0},crusher:{n:'Дробилка',c:'CRU',su:8},fan:{n:'Вентилятор',c:'FAN',su:2},crafter:{n:'Крафтер',c:'CRF',su:2}};
const SOURCES={water:{n:'Водяное колесо',coef:32,rpm:8},large:{n:'Большое колесо',coef:128,rpm:4},wind:{n:'Мельница',coef:512,rpm:16},steam:{n:'Паровой двигатель'}};
const FUELS={coal:{n:'Уголь',burn:1600},log:{n:'Бревно',burn:300}};
const BATCHES=[1,4,16,64];
const FAN_REACH=20; // допущение мокапа: блоков обдува одного вентилятора при 256 RPM
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));

/* ---- Формулы: тики на операцию ---- */
function crusherTicks(rpm,t,N){const sp=rpm/50*4,first=N===1?20:clamp(sp/Math.log2(N),.25,20),last=clamp(sp,.25,20);
  let rem=t,n=0;while(rem>0){rem-=rem>=20?first:last;n++;}return n;}
function fanTicks(N){return 150*(Math.floor((N-1)/16)+1)+1;}
function opTicks(m,rpm,t,N){switch(m){
  case'press':return 240/Math.floor(1+59*Math.min(1,rpm/512));
  case'mixer':return 40+Math.floor(Math.log2(Math.max(1,Math.floor(512/rpm))))*Math.ceil((t||100)/100*15)+1;
  case'mill':return t/clamp(Math.floor(rpm/16),1,512);
  case'saw':return t/clamp(rpm/24,1,128);
  case'deployer':return 2500/clamp(rpm*2,8,512);
  case'spout':return 20;
  case'crusher':return crusherTicks(rpm,t,N);
  case'fan':return fanTicks(N);
  case'crafter':return 2000/clamp(rpm,4,250); // допущение мокапа: формула не задана
}}
const ceil=x=>Math.ceil(x-1e-9);
const pairWord=c=>c%10===1&&c%100!==11?'пара':c%10>=2&&c%10<=4&&!(c%100>=12&&c%100<=14)?'пары':'пар';

/* ---- Выбор самого дешёвого рецепта: сырьё на 1 шт + штраф за операцию ---- */
const byMain={};RECIPES.forEach(r=>{const k=Object.keys(r.out)[0];(byMain[k]=byMain[k]||[]).push(r);});
const memo={};
function itemCost(i){if(!byMain[i])return 1;if(memo[i]==null)memo[i]=Math.min(...byMain[i].map(r=>recipeCost(r,i)));return memo[i];}
function recipeCost(r,i){let c=r.m==='crafter'?.25:.1;for(const x in r.in)c+=r.in[x]*itemCost(x);return c/r.out[i];}
function alts(i){return (byMain[i]||[]).map(r=>({r,cost:recipeCost(r,i)})).sort((a,b)=>a.cost-b.cost);}

/* ---- Состояние ---- */
const S={target:'precision_mechanism',rate:60,rpm:256,maxRpm:256,heat:true,fuel:'coal',source:'water',srcRpm:8,zoom:'auto',over:{}};
const ov=i=>S.over[i]||(S.over[i]={});
function chosen(i){if(!byMain[i])return null;const o=S.over[i]&&S.over[i].recipe;return (o&&byMain[i].find(r=>r.id===o))||alts(i)[0].r;}
const isStock=i=>i!==S.target&&S.over[i]&&S.over[i].stock;

/* ---- Расчёт: рекурсивное развёртывание, побочные выходы вычитаются из суммы ---- */
function solve(){
  const seen={},post=[];
  (function dfs(i){if(seen[i])return;seen[i]=1;const r=isStock(i)?null:chosen(i);if(r)for(const x in r.in)dfs(x);post.push(i);})(S.target);
  const order=post.reverse();let pool={},demand,by,net;
  for(let k=0;k<16;k++){demand={[S.target]:S.rate};by={};net={};
    for(const i of order){const need=demand[i]||0;net[i]=Math.max(0,need-(pool[i]||0));const r=isStock(i)?null:chosen(i);if(!r||net[i]<=0)continue;
      const runs=net[i]/r.out[i];for(const x in r.in)demand[x]=(demand[x]||0)+runs*r.in[x];
      for(const x in r.out)if(x!==i)by[x]=(by[x]||0)+runs*r.out[x];}
    pool=by;}
  const nodes=[],edges=[],byId={};const add=n=>{nodes.push(n);byId[n.id]=n;return n;};
  const load={su:0,machines:0,burners:0};const credits=[];
  for(const i of order){const need=demand[i]||0,got=net[i],cred=need-got;if(cred>1e-9)credits.push({item:i,rate:cred});if(got<=1e-9)continue;
    const r=isStock(i)?null:chosen(i);
    if(!r){add({id:i,item:i,kind:isStock(i)?'stock':'hand',rate:got});continue;}
    add(machineNode(i,r,got,cred));const m=byId[i];load.su+=m.su;load.machines+=m.units;load.burners+=m.burners;}
  for(const n of nodes){if(n.kind!=='machine')continue;const r=n.recipe,runs=n.rate/r.out[n.item];
    for(const x in r.in){const need=demand[x]||0,f=runs*r.in[x]*(need>0?net[x]/need:0);if(f>1e-9&&byId[x])edges.push({from:x,to:n.id,item:x,rate:f});}}
  add({id:'out:'+S.target,item:S.target,kind:'target',rate:S.rate});
  if(byId[S.target])edges.push({from:S.target,to:'out:'+S.target,item:S.target,rate:net[S.target]});
  const residues=[];
  for(const x in by){const surplus=by[x]-Math.min(demand[x]||0,by[x]);if(surplus<=1e-9)continue;
    residues.push({item:x,rate:surplus});add({id:'res:'+x,item:x,kind:'residue',rate:surplus});
    for(const n of nodes){if(n.kind!=='machine'||!n.recipe.out[x]||n.item===x)continue;
      edges.push({from:n.id,to:'res:'+x,item:x,rate:n.rate/n.recipe.out[n.item]*n.recipe.out[x]*surplus/by[x],side:true});}}
  load.fuelPerMin=load.burners*1200/FUELS[S.fuel].burn;
  return {nodes,edges,byId,load,residues,credits,src:sourceNeed(load.su)};
}
function machineNode(i,r,rate,credit){
  const o=S.over[i]||{},rpm=clamp(o.rpm||S.rpm,1,S.maxRpm),N=o.batch||1,def=MACHINES[r.m],runs=rate/r.out[i];
  const n={id:i,item:i,kind:'machine',rate,credit,recipe:r,m:r.m,rpm,rpmOver:!!o.rpm,batch:N,ticks:opTicks(r.m,rpm,r.t,N),burners:0};
  if(r.m==='fan'){n.exact=runs/((N*1200/(150*(Math.floor((N-1)/16)+1)+1)));n.belt=ceil(n.exact);n.count=ceil(n.belt/clamp(rpm/256*FAN_REACH,1,FAN_REACH));n.units=n.count;
    n.perMachine=(N*1200/(150*(Math.floor((N-1)/16)+1)+1));n.su=n.count*def.su*rpm;n.countText=n.belt+' бл. ленты';}
  else if(r.m==='crusher'){n.perMachine=N*1200/n.ticks;n.exact=runs/n.perMachine;n.count=ceil(n.exact);n.units=n.count*2;
    n.su=n.units*def.su*rpm;n.countText=n.count+' '+pairWord(n.count);}
  else if(r.seq){n.perMachine=1200/n.ticks;n.exact=runs*r.seq.loops/n.perMachine;n.steps=r.seq.steps;const c=ceil(n.exact);n.count=c*n.steps;n.units=n.count;
    n.su=n.count*def.su*rpm;n.countText=n.steps+' шага x '+c;}
  else{n.perMachine=1200/n.ticks;n.exact=runs/n.perMachine;n.count=ceil(n.exact);n.units=n.count;n.su=n.count*def.su*rpm;n.countText=n.count+' шт';}
  if(r.heat)n.burners=n.units;
  return n;
}
function sourceNeed(su){const s=SOURCES[S.source];
  if(S.source==='steam'){const l=ceil(su/16384);return{count:l,cap:16384,levels:l,engines:l,tanks:l*4,water:l*10};}
  const cap=s.coef*S.srcRpm;return{count:ceil(su/cap),cap};}

/* ---- Послойная раскладка: слева сырьё, справа цель ---- */
function layout(g,o){
  const {nw,nh,hgap,vgap,pad,labelGap}=o,L={},pred={},succ={};
  g.nodes.forEach(n=>{pred[n.id]=[];succ[n.id]=[];L[n.id]=0;});
  g.edges.forEach(e=>{pred[e.to].push(e);succ[e.from].push(e);});
  for(let k=0;k<g.nodes.length+1;k++)g.edges.forEach(e=>{if(g.byId[e.to].kind!=='residue'&&g.byId[e.to].kind!=='target')L[e.to]=Math.max(L[e.to],L[e.from]+1);});
  const mx=g.nodes.reduce((a,n)=>n.kind==='residue'||n.kind==='target'?a:Math.max(a,L[n.id]),0);
  g.nodes.forEach(n=>{if(n.kind==='target')L[n.id]=mx+1;if(n.kind==='residue')L[n.id]=Math.max(...pred[n.id].map(e=>L[e.from]+1),1);});
  const cols=[];g.nodes.forEach(n=>{n.layer=L[n.id];(cols[n.layer]=cols[n.layer]||[]).push(n);});
  for(let c=0;c<cols.length;c++)cols[c]=cols[c]||[];
  const rank=n=>n.kind==='residue'?1:0;let pos={};cols.forEach(c=>c.forEach((n,i)=>pos[n.id]=i));
  const sweep=(c,adj)=>{const b={};c.forEach(n=>{const a=adj(n);b[n.id]=a.length?a.reduce((s,x)=>s+pos[x],0)/a.length:pos[n.id];});
    c.sort((x,y)=>rank(x)-rank(y)||b[x.id]-b[y.id]);c.forEach((n,i)=>pos[n.id]=i);};
  for(let k=0;k<4;k++){cols.forEach(c=>sweep(c,n=>pred[n.id].map(e=>e.from)));[...cols].reverse().forEach(c=>sweep(c,n=>succ[n.id].filter(e=>!e.side).map(e=>e.to)));}
  const hOf=n=>o.nodeH?o.nodeH(n):nh,colH=c=>c.reduce((s,n)=>s+hOf(n)+vgap,-vgap),H=Math.max(...cols.map(colH),nh);
  cols.forEach((c,ci)=>{let y=pad+(H-colH(c))/2;c.forEach(n=>{n.x=pad+ci*(nw+hgap);n.y=y;n.w=nw;n.h=hOf(n);y+=n.h+vgap;});});
  /* дальние рёбра идут не сквозь узлы, а по шинам: потоки сверху, побочные снизу */
  const span=e=>g.byId[e.to].layer-g.byId[e.from].layer,lg=o.laneGap||9,longs=g.edges.filter(e=>span(e)>1).sort((a,b)=>span(b)-span(a));
  const tops=longs.filter(e=>!e.side),bots=longs.filter(e=>e.side),shift=tops.length?tops.length*lg+8:0;
  g.nodes.forEach(n=>{n.y+=shift;});
  tops.forEach((e,i)=>{e.bus=pad+i*lg;e.stub=8+i%5*4;});bots.forEach((e,i)=>{e.bus=pad+shift+H+10+i*lg;e.stub=8+i%5*4;});
  g.nodes.forEach(n=>{const port=(es,get,sign)=>{es.slice().sort((a,b)=>g.byId[get(a)].y-g.byId[get(b)].y).forEach((e,i)=>{
      const yy=n.y+n.h*(i+1)/(es.length+1);if(sign)e.y1=yy;else e.y2=yy;});};
    port(succ[n.id],e=>e.to,1);port(pred[n.id],e=>e.from,0);});
  g.edges.forEach(e=>{const a=g.byId[e.from],b=g.byId[e.to];e.x1=a.x+a.w;e.x2=b.x;e.lx=b.x-hgap/2;e.ly=e.bus==null?(e.y1+e.y2)/2:e.side?e.y2:(e.bus+e.y2)/2;e.col=b.layer;});
  cols.forEach((_,ci)=>{const es=g.edges.filter(e=>e.col===ci).sort((a,b)=>a.ly-b.ly);
    for(let i=1;i<es.length;i++)if(es[i].ly<es[i-1].ly+labelGap)es[i].ly=es[i-1].ly+labelGap;});
  const low=g.edges.reduce((a,e)=>Math.max(a,e.ly+labelGap,e.bus||0),0);
  g.w=pad*2+cols.length*nw+(cols.length-1)*hgap;g.h=Math.max(pad*2+H+shift,low+pad);
}

function route(e,d){const a=e.lx-d,b=e.lx+d,tail=[[a,e.ly],[b,e.ly],[b,e.y2],[e.x2,e.y2]];
  if(e.bus==null)return [[e.x1,e.y1],[a,e.y1],...tail];
  const sx=e.x1+e.stub;return [[e.x1,e.y1],[sx,e.y1],[sx,e.bus],[a,e.bus],...tail];}
const polyPath=p=>'M'+p.map(q=>q[0]+' '+q[1]).join('L');
function roundPath(p,r){let s='M'+p[0][0]+' '+p[0][1];for(let i=1;i<p.length-1;i++){const[a,b,c]=[p[i-1],p[i],p[i+1]],
    l1=Math.hypot(b[0]-a[0],b[1]-a[1]),l2=Math.hypot(c[0]-b[0],c[1]-b[1]),k=Math.min(r,l1/2,l2/2);if(k<.5){s+='L'+b[0]+' '+b[1];continue;}
    s+='L'+(b[0]+(a[0]-b[0])*k/l1)+' '+(b[1]+(a[1]-b[1])*k/l1)+'Q'+b[0]+' '+b[1]+' '+(b[0]+(c[0]-b[0])*k/l2)+' '+(b[1]+(c[1]-b[1])*k/l2);}
  const z=p[p.length-1];return s+'L'+z[0]+' '+z[1];}

/* ---- Форматирование и общая обработка событий ---- */
const fmt=x=>{const a=Math.abs(x),d=a>=100?0:a>=10?1:2;return String(+x.toFixed(d)).replace('.',',');};
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
const name=i=>ITEMS[i][0],code=i=>ITEMS[i][1],shortName=i=>ITEMS[i][2];
const edgeText=e=>shortName(e.item)+' '+fmt(e.rate)+'/мин';
const zoomFor=(g,cw)=>S.zoom==='auto'?clamp(cw/g.w,.7,1):+S.zoom;
let G=null,sel=null,renderFn=null;
function refresh(){
  const a=document.activeElement,key=a&&a.dataset&&a.dataset.nodeSet?'[data-node-set="'+a.dataset.nodeSet+'"][data-item="'+a.dataset.item+'"]':null;
  G=solve();if(sel&&!G.byId[sel])sel=null;renderFn(G);
  if(key){const b=document.querySelector(key);if(b)b.focus();}
}
function setGlobal(el){const k=el.dataset.set;let v;
  if(el.type==='checkbox')v=el.checked;else if(el.type==='number'||el.type==='range'){if(el.value==='')return;v=Math.max(+el.value,+el.min||0);}else v=el.value;
  if(k==='rpm'||k==='maxRpm'){if(k==='maxRpm')v=clamp(v,1,512);if(k==='rpm')v=clamp(v,1,S.maxRpm);}
  S[k]=v;if(k==='maxRpm'&&S.rpm>v)S.rpm=v;
  if(k==='source'&&SOURCES[v].rpm)S.srcRpm=SOURCES[v].rpm;
  document.querySelectorAll('[data-set="'+k+'"]').forEach(x=>{if(x!==el&&x.type!=='checkbox')x.value=S[k];});
  if(k==='rpm'||k==='maxRpm'||k==='source')document.querySelectorAll('[data-set="rpm"],[data-set="srcRpm"]').forEach(x=>{if(x.dataset.set==='rpm'){x.max=S.maxRpm;x.value=S.rpm;}else{x.value=S.srcRpm;x.disabled=S.source==='steam';}});
  refresh();}
function setNode(item,field,val){const o=ov(item);
  if(field==='rpm'){if(val===''||val==null)delete o.rpm;else o.rpm=clamp(+val,1,S.maxRpm);}
  else if(field==='batch')o.batch=+val;else if(field==='stock')o.stock=!!val;else o[field]=val;refresh();}
document.addEventListener('input',e=>{if(e.target.dataset&&e.target.dataset.set)setGlobal(e.target);});
document.addEventListener('change',e=>{const d=e.target.dataset;if(d&&d.nodeSet)setNode(d.item,d.nodeSet,e.target.type==='checkbox'?e.target.checked:e.target.value);});
document.addEventListener('click',e=>{if(e.target.matches&&e.target.matches('input,select,option,label'))return;const t=e.target.closest&&e.target.closest('[data-node],[data-node-btn],[data-close],[data-pick]');if(!t)return;const d=t.dataset;
  if(d.nodeBtn)setNode(d.item,d.nodeBtn,d.val);
  else if(d.close!=null){sel=null;refresh();}
  else if(d.pick){S.target=d.pick;document.querySelectorAll('[data-set="target"]').forEach(x=>x.value=d.pick);refresh();}
  else{const id=d.node;sel=id.startsWith('out:')?id.slice(4):id;refresh();}});
const fillSelect=(el,pairs)=>{el.innerHTML=pairs.map(p=>'<option value="'+p[0]+'">'+esc(p[1])+'</option>').join('');};
const targetOpts=()=>TARGETS.map(i=>[i,name(i)]);
const sourceOpts=()=>Object.keys(SOURCES).map(k=>[k,SOURCES[k].n]);
const fuelOpts=()=>Object.keys(FUELS).map(k=>[k,FUELS[k].n]);
function initSelects(){document.querySelectorAll('[data-set="target"]').forEach(x=>{fillSelect(x,targetOpts());x.value=S.target;});
  document.querySelectorAll('[data-set="source"]').forEach(x=>{fillSelect(x,sourceOpts());x.value=S.source;});
  document.querySelectorAll('[data-set="fuel"]').forEach(x=>{fillSelect(x,fuelOpts());x.value=S.fuel;});}
const altOptions=n=>alts(n.item).map(a=>'<option value="'+a.r.id+'"'+(a.r===n.recipe?' selected':'')+'>'+esc(a.r.l)+' ['+fmt(a.cost)+']</option>').join('');
const sourceRows=g=>{const s=g.src;return S.source==='steam'?[['Уровни котла',s.levels],['Двигатели',s.engines],['Блоки бака',s.tanks],['Вода, mB/тик',s.water]]:[[SOURCES[S.source].n+', шт',s.count],['Мощность одного, SU',fmt(s.cap)]];};

/* ---- Blueprint: представление ---- */
const GEOM={nw:176,nh:58,hgap:176,vgap:22,pad:30,labelGap:18,nodeH:n=>n.kind==='machine'?58:44};
const TOP=60,BOTTOM=200,$=id=>document.getElementById(id);
function nodeSvg(n){
  const c=sel===n.id||(n.kind==='target'&&sel===n.item)?' sel':'',w=n.w,h=n.h;
  let s='<g class="gn '+n.kind+c+'" data-node="'+n.id+'" transform="translate('+n.x+' '+n.y+')">';
  if(n.kind==='hand'){const a=9;s+='<path d="M'+a+' 0H'+(w-a)+'L'+w+' '+a+'V'+(h-a)+'L'+(w-a)+' '+h+'H'+a+'L0 '+(h-a)+'V'+a+'Z"/>';}
  else s+='<rect width="'+w+'" height="'+h+'"/>';
  if(n.kind==='target')s+='<rect x="3" y="3" width="'+(w-6)+'" height="'+(h-6)+'"/>';
  if(n.kind==='stock')s+='<path class="cut" d="M8 -5L4 '+(h*.33)+'L12 '+(h*.66)+'L8 '+(h+5)+'"/>';
  if(n.kind==='machine'){
    s+='<line x1="0" y1="18" x2="'+w+'" y2="18"/><text x="8" y="13">'+MACHINES[n.m].c+'  '+n.countText+'</text><text x="8" y="33">'+name(n.item)+'</text><text class="sub" x="8" y="49">'+fmt(n.rate)+'/мин  '+n.rpm+(n.rpmOver?'*':'')+' RPM'+(S.heat&&n.burners?'  H'+n.burners:'')+'</text>';
    if(n.m==='crusher'||n.m==='fan')s+='<text class="tag" x="'+(w-6)+'" y="13" text-anchor="end">N='+n.batch+'</text>';}
  else{const tag=n.kind==='hand'?'РУКИ':n.kind==='stock'?'СКЛАД':n.kind==='residue'?'ОСТАТОК':'ЦЕЛЬ',px=n.kind==='stock'?18:10;
    s+='<text x="'+px+'" y="18">'+name(n.item)+'</text><text class="tag" x="'+px+'" y="34">'+tag+'</text><text class="sub" x="'+(w-8)+'" y="34" text-anchor="end">'+fmt(n.rate)+'/мин</text>';}
  return s+'</g>';
}
function edgeSvg(e){return '<path class="edge'+(e.side?' side':'')+'" marker-end="url(#a)" d="'+polyPath(route(e,68))+'"/>';}
function labelSvg(e){const d=68,a=e.lx-d,b=e.lx+d,sd=e.side?' side':'',y=e.ly;
  return '<path class="tick'+sd+'" d="M'+(a-3)+' '+(y+3)+'L'+(a+3)+' '+(y-3)+'M'+(b-3)+' '+(y+3)+'L'+(b+3)+' '+(y-3)+'"/><text class="et'+sd+'" x="'+e.lx+'" y="'+(y-3)+'" text-anchor="middle">'+edgeText(e)+'</text>';}
function callHtml(g){
  const n=g.byId[sel];if(!n)return'';
  const title=name(n.item),x='<button class="x" data-close>закрыть</button>';
  if(n.kind==='hand')return '<h3>'+title+x+'</h3><div class="line"><span>Добыча руками</span><span>'+fmt(n.rate)+'/мин</span></div>';
  if(n.kind==='residue')return '<h3>'+title+x+'</h3><div class="line"><span>Остаток побочного выхода</span><span>'+fmt(n.rate)+'/мин</span></div>';
  const st=(on)=>'<div class="line"><label style="display:flex;gap:6px;align-items:center"><input type="checkbox" '+(on?'checked':'')+' data-node-set="stock" data-item="'+n.item+'">Со склада, обрезать выше</label></div>';
  if(n.kind==='stock')return '<h3>'+title+x+'</h3>'+st(true)+'<div class="line"><span>Со склада</span><span>'+fmt(n.rate)+'/мин</span></div>';
  const o=S.over[n.item]||{},al=alts(n.item);
  let h='<h3>'+title+x+'</h3><div class="line"><span>Машина</span><span>'+MACHINES[n.m].n+'</span></div>';
  if(al.length>1)h+='<div class="line"><span>Рецепт</span><select data-node-set="recipe" data-item="'+n.item+'">'+altOptions(n)+'</select></div>';
  h+='<div class="line"><span>RPM (пусто: '+S.rpm+')</span><input type="number" min="1" max="'+S.maxRpm+'" value="'+(o.rpm||'')+'" placeholder="'+S.rpm+'" data-node-set="rpm" data-item="'+n.item+'"></div>';
  if(n.m==='crusher'||n.m==='fan')h+='<div class="line"><span>Партия</span><span class="btns">'+BATCHES.map(b=>'<button class="'+(b===n.batch?'on':'')+'" data-node-btn="batch" data-item="'+n.item+'" data-val="'+b+'">'+b+'</button>').join('')+'</span></div>';
  if(n.item!==S.target)h+=st(false);
  const rows=[['Тиков на операцию',fmt(n.ticks)],[n.m==='fan'?'На блок ленты':'На машину',fmt(n.perMachine)+'/мин'],['Расчётно',fmt(n.exact)],['Принято',n.countText],['SU',fmt(n.su)]];
  if(n.m==='fan')rows.push(['Вентиляторов',n.count]);
  if(n.credit>1e-9)rows.push(['Зачтено из побочных',fmt(n.credit)+'/мин']);
  if(S.heat&&n.burners)rows.push(['Бёрнеры',n.burners]);
  return h+rows.map(r=>'<div class="line"><span>'+r[0]+'</span><span>'+r[1]+'</span></div>').join('')+'<div class="id">'+n.recipe.id+'</div>';
}
const kv=rows=>rows.map(r=>'<tr><td>'+r[0]+'</td><td class="n">'+r[1]+'</td></tr>').join('');
renderFn=g=>{
  layout(g,GEOM);const box=$('box'),z=zoomFor(g,box.clientWidth),W=Math.max(g.w*z,box.clientWidth),H=Math.max(g.h*z+TOP+BOTTOM,box.clientHeight);
  const n=sel&&g.byId[sel];let cl=0,ct=0,lead='';
  if(n){const nx=n.x*z,nw=n.w*z;cl=nx+nw+36;if(cl+300>W-8)cl=Math.max(8,nx-336);ct=clamp(TOP+n.y*z-8,TOP,Math.max(TOP,H-BOTTOM-280));
    const lx=cl>nx?nx+nw:nx,ly=TOP+(n.y+n.h/2)*z,ex=cl>nx?cl:cl+300;lead='<path class="leader" d="M'+lx+' '+ly+'L'+ex+' '+(ct+14)+'"/>';}
  $('wrap').style.width=W+'px';$('wrap').style.height=H+'px';
  $('wrap').innerHTML='<svg width="'+W+'" height="'+H+'"><defs><pattern id="g1" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="var(--grid)" stroke-width="1"/></pattern><pattern id="g2" width="100" height="100" patternUnits="userSpaceOnUse"><rect width="100" height="100" fill="url(#g1)"/><path d="M100 0H0V100" fill="none" stroke="var(--grid2)" stroke-width="1"/></pattern><marker id="a" viewBox="0 0 8 6" refX="8" refY="3" markerWidth="8" markerHeight="6" orient="auto"><path class="arrow" d="M0 0L8 3L0 6z"/></marker></defs><rect width="'+W+'" height="'+H+'" fill="url(#g2)"/><g transform="translate(0 '+TOP+') scale('+z+')">'+g.edges.map(edgeSvg).join('')+g.nodes.map(nodeSvg).join('')+g.edges.map(labelSvg).join('')+'</g>'+lead+'</svg>'
   +(n?'<div id="call" style="left:'+cl+'px;top:'+ct+'px">'+callHtml(g)+'</div>':'');
  const l=g.load,lr=[['Сумма SU',fmt(l.su)],['Машин',l.machines]];if(S.heat)lr.push(['Блейз-бёрнеры',l.burners],['Топливо, шт/мин',fmt(l.fuelPerMin)]);
  $('load').innerHTML=kv(lr);$('fuelsel').style.display=S.heat?'':'none';
  $('src').innerHTML=kv(sourceRows(g));
  $('restb').innerHTML=kv(g.residues.map(r=>[name(r.item),fmt(r.rate)]))||'<tr><td>нет</td></tr>';
  $('cred').innerHTML=kv(g.credits.map(r=>[name(r.item),fmt(r.rate)]))||'<tr><td>нет</td></tr>';
};
addEventListener('resize',()=>refresh());
initSelects();refresh();
</script>
</body>
</html>
