<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Create: граф производства</title>
<style>
:root{--bg:#121417;--card:#1b1e23;--line:#2e3238;--line2:#3b4048;--text:#e4e6e9;--dim:#a3a8b0;--blue:#5ca6ee;--orange:#eda83c;--green:#6fd08a;--gold:#d9b65a;--red:#e07a6a}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:12px/1.35 "Segoe UI",system-ui,sans-serif;overflow:hidden}
button,input,select{font:inherit;color:inherit}
#canvas{position:fixed;inset:0;cursor:grab;touch-action:none;background:var(--bg)}
#canvas.pan{cursor:grabbing}
#world{position:absolute;left:0;top:0;width:1px;height:1px;transform-origin:0 0}
#edges{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible;pointer-events:none}
#labels{position:absolute;left:0;top:0;pointer-events:none}
.elabel{position:absolute;display:flex;flex-direction:column;align-items:center;transform:translate(-50%,-9px);color:#8f949b;font-size:10.5px;white-space:nowrap}
.elabel{pointer-events:auto;cursor:pointer}
.elabel span.t{color:var(--blue)}
.elabel span.warn,.note.warn{color:#d9a441}
.elabel span.n{margin-top:1px;padding:0 2px;background:var(--bg);border-radius:2px;line-height:13px}
.ic{display:inline-flex;align-items:center;justify-content:center;flex:none;border-radius:2px;font-weight:600;line-height:1;letter-spacing:-.02em;user-select:none}
.node{position:absolute;width:260px;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:9px 10px 7px;cursor:pointer;user-select:none}
.node:hover{border-color:var(--line2)}
.node.goal{border-color:var(--gold);border-width:1.5px;padding:8.5px 9.5px 6.5px}
.node.sel{border-color:#9fb2c6}
.node.goal.sel{border-color:#f0d58a}
.head{display:flex;align-items:center;gap:9px}
.head>div{flex:1;min-width:0;display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.head .t{font-size:14px;font-weight:600;line-height:18px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.head .r{color:var(--blue);font-size:13px;line-height:18px;white-space:nowrap;flex:none}
.sub{margin-top:7px;font-size:11.5px;color:var(--dim);line-height:14px}
.sub.green{color:var(--green)}
.sub svg{vertical-align:-2px;margin-right:3px}
.mach{display:flex;align-items:center;gap:6px;border-top:1px solid var(--line);margin-top:7px;padding-top:6px;min-height:30px}
.mach+.mach{border-top:0;margin-top:0;padding-top:1px}
.mach .name{flex:1;min-width:0;font-size:13px;line-height:17px}
.mach .proc{display:block;color:var(--dim);font-size:11.5px;line-height:15px}
.mach .x{color:var(--orange);font-weight:600;font-size:17px;white-space:nowrap;text-align:right;line-height:20px}
.mach .x small{display:block;color:var(--dim);font-weight:400;font-size:11px;line-height:13px}
.rc{flex:none;align-self:stretch;background:none;border:0;padding:0 0 0 3px;color:var(--dim);font-size:12px;cursor:pointer}
.rc:hover{color:var(--text)}
.stats{display:grid;grid-template-columns:1fr auto;gap:1px 10px;border-top:1px solid var(--line);margin-top:6px;padding-top:5px;font-size:12px;line-height:17px;color:var(--text)}
.stats .r2{text-align:right}
.stats .own{color:var(--gold)}
.stats .muted{color:var(--dim)}
.stats .tight{color:#d9a441}
.stats .heat{color:var(--orange)}
.far .stats,.far .proc{visibility:hidden}
.far .head .t{font-size:18px}
.far .head .r{font-size:16px}
/* Bar */
#bar{position:fixed;left:0;right:0;top:0;height:44px;display:flex;align-items:center;gap:14px;padding:0 12px;background:#17191d;border-bottom:1px solid var(--line);z-index:5}
.fld{display:flex;align-items:center;gap:6px;color:var(--dim)}
.inp{height:28px;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:0 7px;color:var(--text);outline:0}
.inp:focus{border-color:#5a6470}
input[type=number]{appearance:textfield}
input[type=number]::-webkit-inner-spin-button{display:none}
#search{width:270px;padding-left:31px}
#searchWrap{position:relative}
#searchIcon{position:absolute;left:6px;top:4px;display:flex}
#sugg{position:absolute;left:0;top:32px;width:330px;background:var(--card);border:1px solid var(--line2);border-radius:6px;padding:3px;display:none;max-height:380px;overflow:auto}
#sugg div{display:flex;align-items:center;gap:8px;padding:4px 6px;border-radius:3px;cursor:pointer}
#sugg div small{margin-left:auto;color:var(--dim);font-size:10px}
#sugg div.on{background:#2a2e35}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.seg button{background:var(--bg);border:0;border-left:1px solid var(--line);height:26px;padding:0 10px;color:var(--dim);cursor:pointer}
.seg button:first-child{border-left:0}
.seg button.on{background:#2a2e35;color:var(--text)}
.chk{display:flex;align-items:center;gap:6px;color:var(--text);cursor:pointer}
.chk input{margin:0;accent-color:var(--orange)}
#totals{margin-left:auto;height:30px;background:none;border:1px solid var(--line);border-radius:4px;padding:0 10px;cursor:pointer;white-space:nowrap}
#totals:hover,#totals.on{border-color:var(--line2);background:#22252b}
#totals .w{color:var(--red);margin-left:6px}
/* Panel */
#panel{position:fixed;right:0;top:44px;bottom:0;width:340px;background:#17191d;border-left:1px solid var(--line);z-index:4;overflow:auto;padding:12px 14px 20px;display:none}
#panel.open{display:block}
#panel h2{font-size:12.5px;font-weight:600;margin:0}
#panel h3{font-size:10.5px;font-weight:400;color:var(--dim);margin:16px 0 5px}
.ph{display:flex;align-items:center;gap:9px;padding-right:24px;min-height:30px}
#close{position:absolute;right:9px;top:12px;width:24px;height:24px;background:none;border:0;color:var(--dim);cursor:pointer;font-size:15px}
#close:hover{color:var(--text)}
.row{display:flex;align-items:center;gap:7px;padding:2px 0;min-height:21px}
.row .v{margin-left:auto;white-space:nowrap;color:var(--blue)}
.row .v.p{color:var(--text)}
.row .d{color:var(--dim);font-size:10.5px}
#panel select,#panel .inp{width:100%}
#panel select{height:28px;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:0 3px}
#panel select option{background:var(--card)}
.btn{height:28px;background:#22252b;border:1px solid var(--line2);border-radius:4px;padding:0 11px;cursor:pointer}
.btn:hover:not(:disabled){background:#2c3037}
.btn:disabled{opacity:.45;cursor:default}
.btns{display:flex;gap:7px;flex-wrap:wrap;margin-top:16px}
.note{color:var(--dim);font-size:10.5px;margin-top:4px}
.warn{color:var(--red);font-size:11px;margin:3px 0}
/* Bottom */
#status{position:fixed;left:12px;bottom:10px;color:var(--dim);z-index:3;max-width:60%}
#status.err{color:var(--red)}
#zoom{position:fixed;left:12px;bottom:32px;display:flex;gap:4px;z-index:3;align-items:center;color:var(--dim)}
#zoom button{height:24px;min-width:24px;background:#17191d;border:1px solid var(--line);border-radius:4px;cursor:pointer;color:var(--dim)}
#zoom button:hover{color:var(--text)}
</style>
</head>
<body>
<div id="canvas"><div id="world"><svg id="edges"></svg><div id="labels"></div><div id="nodes"></div></div></div>
<header id="bar">
  <div id="searchWrap"><span id="searchIcon"></span><input id="search" class="inp" placeholder="Что производить" autocomplete="off" spellcheck="false" aria-label="Цель"><div id="sugg"></div></div>
  <label class="fld"><input id="per" class="inp" type="number" min="0.01" step="any" style="width:64px"> в минуту</label>
  <label class="fld"><input id="rpm" class="inp" type="number" min="1" max="256" step="any" style="width:58px"> RPM</label>
  <div class="seg" id="mode"><button data-v="normal">Обычный</button><button data-v="full_auto">Полная автоматизация</button></div>
  <label class="fld"><input id="belt" class="inp" type="number" min="1" max="256" step="any" style="width:58px"> RPM лент</label>
  <label class="chk"><input id="heat" type="checkbox"> Нагрев</label>
  <button id="totals" title="Нагрузка и здания"></button>
</header>
<aside id="panel"><button id="close" aria-label="Закрыть">&times;</button><div id="panelBody"></div></aside>
<div id="zoom"><button id="zOut" aria-label="Отдалить">&minus;</button><button id="zIn" aria-label="Приблизить">+</button><button id="zFit">Вписать</button></div>
<div id="status"></div>
<script>

/* Snapshot of one real server response (andesite alloy, 60/min, full_auto). */
const SNAP = /*SNAP*/{"plan":{"nodes":[{"id":"recipe:create:compacting/andesite_from_flint","type":"recipe","recipe":"create:compacting/andesite_from_flint","produces":"minecraft:andesite","runs_per_min":60.000000000000036,"loads":[{"machine":"press","rpm":256.0,"ticks":11,"items_per_op":1,"exact":0.5500000000000004,"count":1,"su":2048.0}],"heat":"none","burners":0,"alternatives":["create:andesite_from_stone_types_andesite_stonecutting","minecraft:andesite"],"machine_options":["press"]},{"id":"recipe:create:milling/cobblestone","type":"recipe","recipe":"create:milling/cobblestone","produces":"minecraft:gravel","runs_per_min":540.0000000000002,"loads":[{"machine":"millstone","rpm":256.0,"ticks":17,"items_per_op":1,"exact":7.650000000000003,"count":8,"su":8192.0}],"heat":"none","burners":0,"alternatives":[],"machine_options":["millstone","crushing_wheels"]},{"id":"recipe:create:mixing/andesite_alloy","type":"recipe","recipe":"create:mixing/andesite_alloy","produces":"create:andesite_alloy","runs_per_min":59.99999999999998,"loads":[{"machine":"mixer","rpm":256.0,"ticks":57,"items_per_op":1,"exact":2.8499999999999988,"count":3,"su":3072.0}],"heat":"none","burners":0,"alternatives":["create:crafting/materials/andesite_alloy","create:crafting/materials/andesite_alloy_from_block","create:crafting/materials/andesite_alloy_from_zinc","create:mixing/andesite_alloy_from_zinc","create:sequenced_assembly/precision_mechanism"],"machine_options":["mixer"]},{"id":"recipe:create:splashing/gravel","type":"recipe","recipe":"create:splashing/gravel","produces":"minecraft:flint","runs_per_min":480.00000000000017,"loads":[{"machine":"fan","rpm":256.0,"ticks":151,"items_per_op":1,"exact":3.020000000000001,"count":4,"su":2048.0,"stream_blocks":60.40000000000002,"max_belt_rpm":63.576158940397356}],"heat":"none","burners":0,"alternatives":["create:crushing/tuff","create:crushing/tuff_recycling","create:milling/gravel","create:crushing/gravel"],"machine_options":["fan"]},{"id":"generate:fluid:minecraft:lava","type":"generate","res":"fluid:minecraft:lava","per_minute":6000.000000000002,"load":null},{"id":"generate:minecraft:cobblestone","type":"generate","res":"minecraft:cobblestone","per_minute":540.0000000000002,"load":{"machine":"drill","rpm":256.0,"ticks":11,"items_per_op":1,"exact":4.950000000000002,"count":5,"su":5120.0}},{"id":"target:create:andesite_alloy","type":"target","res":"create:andesite_alloy","per_minute":60.0}],"edges":[{"from":"generate:fluid:minecraft:lava","to":"recipe:create:compacting/andesite_from_flint","res":"fluid:minecraft:lava","per_minute":6000.000000000003},{"from":"generate:minecraft:cobblestone","to":"recipe:create:milling/cobblestone","res":"minecraft:cobblestone","per_minute":540.0000000000002,"transport":{"stack":1,"belt_rpm":256.0,"belts":1,"min_belt_rpm":216.00000000000009,"funnels":4,"needs_buffer":false}},{"from":"recipe:create:compacting/andesite_from_flint","to":"recipe:create:mixing/andesite_alloy","res":"minecraft:andesite","per_minute":59.99999999999998,"transport":{"stack":1,"belt_rpm":256.0,"belts":1,"min_belt_rpm":23.999999999999993,"funnels":1,"needs_buffer":false}},{"from":"recipe:create:milling/cobblestone","to":"recipe:create:compacting/andesite_from_flint","res":"minecraft:gravel","per_minute":60.000000000000036,"transport":{"stack":1,"belt_rpm":256.0,"belts":1,"min_belt_rpm":24.000000000000014,"funnels":1,"needs_buffer":false}},{"from":"recipe:create:milling/cobblestone","to":"recipe:create:splashing/gravel","res":"minecraft:gravel","per_minute":480.00000000000017,"transport":{"stack":1,"belt_rpm":256.0,"belts":1,"min_belt_rpm":192.00000000000006,"funnels":4,"needs_buffer":false}},{"from":"recipe:create:mixing/andesite_alloy","to":"target:create:andesite_alloy","res":"create:andesite_alloy","per_minute":60.0,"transport":{"stack":1,"belt_rpm":256.0,"belts":1,"min_belt_rpm":24.0,"funnels":1,"needs_buffer":false}},{"from":"recipe:create:splashing/gravel","to":"recipe:create:compacting/andesite_from_flint","res":"minecraft:flint","per_minute":120.00000000000009,"transport":{"stack":1,"belt_rpm":256.0,"belts":1,"min_belt_rpm":48.000000000000036,"funnels":1,"needs_buffer":false}},{"from":"recipe:create:splashing/gravel","to":"recipe:create:mixing/andesite_alloy","res":"minecraft:iron_nugget","per_minute":59.99999999999998,"transport":{"stack":1,"belt_rpm":256.0,"belts":1,"min_belt_rpm":23.999999999999993,"funnels":1,"needs_buffer":false}}],"total_su":20480.0,"machines":{"drill":5,"fan":4,"millstone":8,"mixer":3,"press":1},"heat":{"burners_heated":0,"burners_superheated":0,"coal_per_min":0.0,"cake_per_min":0.0},"warnings":[],"manual":[]},"recipes":{"create:compacting/andesite_from_flint":{"kind":"compacting","inputs":[{"amount":2.0,"res":"minecraft:flint"},{"amount":1.0,"res":"minecraft:gravel"},{"amount":100.0,"res":"fluid:minecraft:lava"}],"outputs":[{"amount":1.0,"chance":1.0,"res":"minecraft:andesite"}]},"create:milling/cobblestone":{"kind":"milling","inputs":[{"amount":1.0,"res":"minecraft:cobblestone"}],"outputs":[{"amount":1.0,"chance":1.0,"res":"minecraft:gravel"}]},"create:mixing/andesite_alloy":{"kind":"mixing","inputs":[{"amount":1.0,"res":"minecraft:andesite"},{"amount":1.0,"res":"#c:nuggets/iron"}],"outputs":[{"amount":1.0,"chance":1.0,"res":"create:andesite_alloy"}]},"create:splashing/gravel":{"kind":"splashing","inputs":[{"amount":1.0,"res":"minecraft:gravel"}],"outputs":[{"amount":1.0,"chance":0.25,"res":"minecraft:flint"},{"amount":1.0,"chance":0.125,"res":"minecraft:iron_nugget"}]}},"names":{"create:andesite_alloy":"Andesite Alloy","fluid:minecraft:lava":"fluid:minecraft:lava","minecraft:andesite":"Andesite","minecraft:cobblestone":"Cobblestone","minecraft:flint":"Flint","minecraft:gravel":"Gravel","minecraft:iron_nugget":"Iron Nugget"},"power":{"su":20480.0,"boilers":{"levels":2,"engines":2,"tank_blocks":8,"water_mb_per_tick":20,"burners_kindled":2,"burners_seething":1},"sources":[{"id":"water_wheel","su_each":256.0,"count":80},{"id":"large_water_wheel","su_each":512.0,"count":40},{"id":"windmill_bearing","su_each":4096.0,"count":5},{"id":"steam_engine_level","su_each":16384.0,"count":2}]}}/*END*/;

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const S = {belt:null, stacks:{}, item:'create:andesite_alloy', itemName:'', per:60, rpm:256, mode:'full_auto', heat:true, stock:[], choice:{}, overrides:{}};
const items = new Map();
const recipes = new Map();
let itemsLoaded = false, plan = null, power = null, offline = false, seq = 0;
let G = {nodes:new Map(), edges:[]};
const pins = new Map();
let view = {x:0, y:0, k:1};
let panel = null; // {kind:'load'} or {kind:'node', id, res}

/* ---------- Text ---------- */
function fmt(x){
  const a = Math.abs(x);
  const r = a >= 100 ? Math.round(x) : a >= 10 ? Math.round(x*10)/10 : Math.round(x*100)/100;
  const [i, d] = String(r).split('.');
  return i.replace(/\B(?=(\d{3})+$)/g, ' ') + (d ? '.' + d : '');
}
const isFluid = id => id.startsWith('fluid:');
const volume = e => isFluid(e.res) ? e.per_minute / 1000 : e.per_minute; // buckets weigh like items
const unit = id => isFluid(id) ? 'мБ' : '';
const rateText = (id, v) => fmt(v) + (isFluid(id) ? ' мБ' : '') + '/мин';
function readable(id){
  const s = id.replace(/^#/, '').replace(/^fluid:/, '').split(':').pop().replace(/[_/]+/g, ' ').trim();
  return s.charAt(0).toUpperCase() + s.slice(1);
}
function nameOf(id){
  const it = items.get(id);
  return it && it.name && it.name !== id ? it.name : readable(id);
}
function plural(n, a, b, c){
  const m = n % 100, k = n % 10;
  return m > 10 && m < 20 ? c : k === 1 ? a : k >= 2 && k <= 4 ? b : c;
}
const MACH = {press:'Механический пресс', mixer:'Механический миксер', millstone:'Жернов', crushing_wheels:'Дробильные колёса', saw:'Механическая пила', deployer:'Деплоер', spout:'Дозатор', item_drain:'Слив', mechanical_crafter:'Механический крафтер', fan:'Вентилятор', drill:'Механическая дрель', furnace:'Печь', blast_furnace:'Плавильная печь', smoker:'Коптильня', hand:'Вручную'};
const FAN = {splashing:'Вентилятор + вода (промывка)', haunting:'Вентилятор + огонь душ (преследование)', smelting:'Вентилятор + лава (плавка)', blasting:'Вентилятор + лава (плавка)', smoking:'Вентилятор + огонь (копчение)'};
const KIND = {pressing:'Прессование', compacting:'Уплотнение', mixing:'Смешивание', milling:'Помол', crushing:'Дробление', cutting:'Распил', deploying:'Деплоер', filling:'Наполнение', emptying:'Слив', splashing:'Промывка', haunting:'Преследование', smelting:'Плавка', blasting:'Плавка', smoking:'Копчение', crafting_shaped:'Крафт', crafting_shapeless:'Крафт', mechanical_crafting:'Механический крафт', stonecutting:'Камнерез', smithing:'Кузнечный стол', sequenced_assembly:'Сборка'};
const SOURCES = {water_wheel:'Водяное колесо', large_water_wheel:'Большое водяное колесо', windmill_bearing:'Мельница (64 паруса)', steam_engine_level:'Уровень паровых двигателей'};
const machineName = (m, kind) => m === 'fan' && FAN[kind] || MACH[m] || readable(m);

/* ---------- Icon: replace this function when real icons become available ---------- */
const MATERIALS = [
  [/gold|golden/,'#e3bd3f'],[/brass/,'#c9a24a'],[/copper/,'#c77a4a'],[/zinc/,'#8fb0ae'],[/iron|andesite_alloy/,'#a7abb0'],
  [/quartz/,'#ece8e0'],[/soul_sand/,'#6e5340'],[/red_sand/,'#c0683a'],[/sand/,'#dcc98e'],[/gravel/,'#85817c'],[/flint/,'#44464a'],
  [/cobble/,'#7c7c7c'],[/diorite/,'#c9c8c4'],[/andesite/,'#8b8d8c'],[/granite/,'#99695a'],[/stone/,'#7f8082'],[/clay/,'#9aa4b2'],
  [/lava/,'#d9662a'],[/water/,'#3f76c4'],[/redstone/,'#b8352b'],[/coal|blaze_cake/,'#2f3033'],[/spruce|oak|birch|planks|wood|log/,'#8a6a42'],
  [/terracotta/,'#a5694e'],[/lapis/,'#2f55a8'],[/diamond/,'#62d0cf'],[/emerald/,'#3fb56a'],[/obsidian/,'#2e2640'],[/dead_bush/,'#8c6a3a']];
const PALETTE = ['#6d8bb0','#8f7cb5','#7ca37f','#b08a6d','#5f9ea0','#a7798f','#8e9a5b','#b3a066','#6b7fa6','#9c7a62','#6c9c8b','#9a6f6f','#7d8899','#a08fb0','#7f9c63','#b08c8c'];
function hash(s){ let h = 2166136261; for (const c of s) h = Math.imul(h ^ c.charCodeAt(0), 16777619); return h >>> 0; }
function iconColor(id){
  const key = id.replace(/^fluid:/, '').split(':').pop();
  for (const [re, c] of MATERIALS) if (re.test(key)) return c;
  return PALETTE[hash(id) % PALETTE.length];
}
function iconLetters(name){
  const w = name.replace(/[()+,.]/g, ' ').split(/\s+/).filter(Boolean);
  if (w.length > 1) return (w[0][0] + w[1][0]).toUpperCase();
  return (w[0] || '?').slice(0, 2).replace(/^./, c => c.toUpperCase());
}
function icon(id, name, size){
  const c = iconColor(id);
  const n = parseInt(c.slice(1), 16), lum = .299*(n>>16) + .587*(n>>8&255) + .114*(n&255);
  return `<span class="ic" style="width:${size}px;height:${size}px;background:${c};color:${lum > 130 ? '#1a1b1e' : '#f1f1f1'};font-size:${Math.round(size*.46)}px">${esc(iconLetters(name))}</span>`;
}
const itemIcon = (id, size) => icon(id, nameOf(id), size);
const machineIcon = (m, size) => icon('machine:' + m, MACH[m] || m, size).replace(/background:#[0-9a-f]+/, 'background:#3c4047').replace(/color:#[0-9a-f]+/, 'color:#d8dade');
function tint(hex){ // muted item colour for edges
  const n = parseInt(hex.slice(1), 16), base = 142, t = .32;
  const mix = v => Math.round(base + (v - base)*t);
  return `rgb(${mix(n>>16)},${mix(n>>8&255)},${mix(n&255)})`;
}

/* ---------- Server ---------- */
async function api(path, body){
  const r = await fetch(API + path, body === undefined ? {} : {method:'POST', headers:{'content-type':'application/json'}, body:JSON.stringify(body)});
  const data = await r.json().catch(() => ({}));
  if (!r.ok) { const e = new Error(data.error || 'HTTP ' + r.status); e.http = true; throw e; }
  return data;
}
async function loadItems(){
  if (itemsLoaded) return;
  const list = await api('/api/items?limit=5000&lang=en');
  for (const it of list) items.set(it.id, it);
  itemsLoaded = true;
}
function loadRecipe(id){
  if (recipes.has(id)) return Promise.resolve(recipes.get(id));
  return api('/api/recipes/' + encodeURI(id)).then(r => (recipes.set(id, r), r));
}
function request(){
  return {targets:[{item:S.item, per_minute:S.per}], rpm:S.rpm, mode:S.mode, include_heat:S.heat, stock:S.stock, recipe_choice:S.choice, overrides:S.overrides, belt_rpm:S.belt, stack_sizes:S.stacks};
}
const mainRes = r => r && r.outputs[0] ? r.outputs[0].res : null;
const outputRate = (n, r, res) => n.runs_per_min * r.outputs.filter(o => o.res === res).reduce((s, o) => s + o.amount * o.chance, 0);
const nodeRes = n => n.type === 'recipe' ? (n.produces || mainRes(recipes.get(n.recipe))) : n.res;

async function replan(opts = {}){
  const my = ++seq;
  try {
    await loadItems();
    const p = await api('/api/plan', request());
    await Promise.all(p.nodes.filter(n => n.type === 'recipe').map(n => loadRecipe(n.recipe)));
    if (my !== seq) return;
    offline = false; setStatus('');
    show(p, opts);
    api('/api/power', {su:p.total_su}).then(r => { if (my === seq) { power = r; if (panel && panel.kind === 'load') renderPanel(); } }).catch(() => {});
  } catch (e) {
    if (my !== seq) return;
    if (e.http) { setStatus(/^invalid request: rpm/.test(e.message) ? 'RPM вне допустимого диапазона' : e.message, true); return; }
    offline = true;
    for (const [id, name] of Object.entries(SNAP.names)) if (!items.has(id)) items.set(id, {id, name, has_recipe:true});
    for (const [id, r] of Object.entries(SNAP.recipes)) if (!recipes.has(id)) recipes.set(id, r);
    power = SNAP.power;
    setStatus('Сервер не запущен: показан сохранённый пример');
    show(SNAP.plan, opts);
  }
}
function setStatus(t, err){ const s = $('status'); s.textContent = t; s.className = err ? 'err' : ''; }

function show(p, opts){
  const oldRes = new Map();
  for (const n of G.nodes.values()) oldRes.set(n.id, n.res);
  plan = p;
  buildGraph(p);
  // A pin follows the item when its recipe changes, so the card stays where it was put.
  for (const [id, pos] of [...pins]) {
    if (G.nodes.has(id)) continue;
    const res = oldRes.get(id);
    const heir = [...G.nodes.values()].find(n => n.type !== 'surplus' && n.res === res && !pins.has(n.id));
    pins.delete(id);
    if (heir) pins.set(heir.id, pos);
  }
  renderNodes();
  layout();
  renderPositions();
  renderEdges();
  renderTotals();
  if (panel && panel.kind === 'node') {
    const all = [...G.nodes.values()];
    const hit = G.nodes.get(panel.id) || all.find(n => n.type !== 'surplus' && n.res === panel.res);
    if (hit) panel.id = hit.id; else panel = null;
  }
  renderPanel();
  if (opts.fit) fit();
  document.querySelectorAll('.node').forEach(el => el.classList.toggle('sel', !!panel && panel.id === el.dataset.id));
}

/* ---------- Graph model ---------- */
function buildGraph(p){
  const nodes = new Map(), goals = new Set();
  for (const e of p.edges) if (e.to.startsWith('target:')) goals.add(e.from);
  for (const n of p.nodes) {
    if (n.type === 'target') continue;
    const m = {...n, res:nodeRes(n), goal:goals.has(n.id), h:100, x:0, y:0, ins:[], outs:[]};
    m.rate = n.type === 'recipe' ? outputRate(n, recipes.get(n.recipe), m.res) : n.per_minute;
    nodes.set(n.id, m);
  }
  const edges = [];
  for (const e of p.edges) {
    if (e.to.startsWith('target:') || !nodes.has(e.from) || !nodes.has(e.to)) continue;
    const src = nodes.get(e.from);
    const edge = {...e, side:src.type === 'recipe' && e.res !== src.res};
    edges.push(edge); src.outs.push(edge); nodes.get(e.to).ins.push(edge);
  }
  for (const n of nodes.values()) if (n.type === 'surplus') n.byproduct = n.ins.every(e => e.side);
  G = {nodes, edges};
}

/* ---------- Layout: layered, left to right ---------- */
function layout(){
  const {nodes, edges} = G;
  const core = [...nodes.values()].filter(n => n.type !== 'surplus');
  // Break cycles walking upstream from the goal, main flows first, so by-product loops become the back edges.
  const state = new Map();
  for (const e of edges) e.back = false;
  const visit = n => {
    state.set(n.id, 1);
    const ins = n.ins.slice().sort((a, b) => (a.side - b.side) || (volume(b) - volume(a)));
    for (const e of ins) {
      const s = state.get(e.from);
      if (s === 1) e.back = true;
      else if (!s) visit(nodes.get(e.from));
    }
    state.set(n.id, 2);
  };
  core.filter(n => n.goal).forEach(n => state.get(n.id) || visit(n));
  core.forEach(n => state.get(n.id) || visit(n));
  // Longest path layers; sources then move right next to their first consumer.
  const live = e => !e.back && nodes.get(e.to).type !== 'surplus';
  const layer = new Map(core.map(n => [n.id, 0]));
  const indeg = new Map(core.map(n => [n.id, n.ins.filter(live).length]));
  const queue = core.filter(n => !indeg.get(n.id));
  for (let i = 0; i < queue.length; i++) {
    for (const e of queue[i].outs.filter(live)) {
      layer.set(e.to, Math.max(layer.get(e.to), layer.get(e.from) + 1));
      indeg.set(e.to, indeg.get(e.to) - 1);
      if (!indeg.get(e.to)) queue.push(nodes.get(e.to));
    }
  }
  for (const n of core) {
    if (n.ins.some(live)) continue;
    const outs = n.outs.filter(live).map(e => layer.get(e.to));
    if (outs.length) layer.set(n.id, Math.min(...outs) - 1);
  }
  for (const n of nodes.values()) if (n.type === 'surplus') layer.set(n.id, Math.max(0, ...n.ins.map(e => layer.get(e.from) + 1)));
  const minL = Math.min(...layer.values());
  for (const [k, v] of layer) layer.set(k, v - minL);
  const count = Math.max(...layer.values()) + 1;

  // Main chain: from the goal back through the longest main-output path.
  const chain = new Set();
  let cur = core.find(n => n.goal);
  while (cur && !chain.has(cur.id)) {
    chain.add(cur.id);
    const ins = cur.ins.filter(e => !e.back).sort((a, b) => (layer.get(b.from) - layer.get(a.from)) || (a.side - b.side) || (volume(b) - volume(a)));
    cur = ins[0] && nodes.get(ins[0].from);
  }

  // Vertices per column, with dummies carrying long edges.
  const cols = Array.from({length:count}, () => []);
  const V = new Map();
  for (const n of nodes.values()) {
    const v = {id:n.id, h:n.h, node:n, pos:0, y:0, nb:[]};
    V.set(n.id, v); cols[layer.get(n.id)].push(v);
  }
  const link = (a, b, w) => { a.nb.push([b, w]); b.nb.push([a, w]); };
  for (const e of edges) {
    e.via = [];
    if (e.back) continue;
    const toSurplus = nodes.get(e.to).type === 'surplus';
    let prev = V.get(e.from);
    for (let l = layer.get(e.from) + 1; l < layer.get(e.to); l++) {
      const d = {id:'d' + e.from + e.to + e.res + l, h:DUMMY_H, dummy:true, pos:0, y:0, nb:[]};
      cols[l].push(d); e.via.push(d); link(prev, d, 2); prev = d;
    }
    if (!toSurplus) link(prev, V.get(e.to), chain.has(e.from) && chain.has(e.to) ? 3 : 1);
    else V.get(e.to).src = prev;
  }

  // Ordering: barycentre sweeps, keeping the arrangement with the fewest crossings.
  const number = c => c.forEach((v, i) => v.pos = i);
  const surplusLast = c => c.sort((a, b) => (!!(a.node && a.node.type === 'surplus') - !!(b.node && b.node.type === 'surplus')) || 0);
  const crossings = () => {
    let total = 0;
    for (let l = 0; l + 1 < count; l++) {
      const pairs = [];
      for (const a of cols[l]) for (const [b] of a.nb) if (cols[l + 1].includes(b)) pairs.push([a.pos, b.pos]);
      for (let i = 0; i < pairs.length; i++) for (let j = i + 1; j < pairs.length; j++)
        if ((pairs[i][0] - pairs[j][0]) * (pairs[i][1] - pairs[j][1]) < 0) total++;
    }
    return total;
  };
  cols.forEach(number);
  let best = cols.map(c => c.slice()), bestX = crossings();
  for (let round = 0; round < 16; round++) {
    const fwd = round % 2 === 0;
    for (let i = 0; i < count; i++) {
      const l = fwd ? i : count - 1 - i, ref = cols[fwd ? l - 1 : l + 1];
      if (!ref) continue;
      const bary = new Map(cols[l].map(v => {
        const src = v.src ? [v.src] : v.nb.filter(([o]) => ref.includes(o)).map(([o]) => o);
        const list = src.filter(o => ref.includes(o));
        return [v, list.length ? list.reduce((s, o) => s + o.pos, 0) / list.length : v.pos];
      }));
      cols[l].sort((a, b) => bary.get(a) - bary.get(b));
      surplusLast(cols[l]);
      number(cols[l]);
    }
    const x = crossings();
    if (x < bestX) { bestX = x; best = cols.map(c => c.slice()); }
  }
  best.forEach((c, i) => { cols[i] = c; surplusLast(c); number(c); });

  // Y: neighbours pull, the main chain anchors at zero, each column keeps its order and gaps.
  const place = (col, want) => {
    let off = 0;
    const blocks = [];
    col.forEach((v, i) => {
      if (i) off += (col[i - 1].h + v.h) / 2 + (v.node && v.node.type === 'surplus' ? 24 : GAP_Y);
      let b = {w:want[i][1], z:want[i][0] - off, n:[{v, off}]};
      while (blocks.length && blocks[blocks.length - 1].z >= b.z) {
        const a = blocks.pop();
        b = {w:a.w + b.w, z:(a.z*a.w + b.z*b.w) / (a.w + b.w), n:a.n.concat(b.n)};
      }
      blocks.push(b);
    });
    for (const b of blocks) for (const {v, off} of b.n) v.y = b.z + off;
  };
  cols.forEach(col => { let y = 0; col.forEach(v => { v.y = y; y += v.h + GAP_Y; }); });
  for (let it = 0; it < 40; it++) {
    const order = it % 2 ? cols : cols.slice().reverse();
    for (const col of order) {
      place(col, col.map(v => {
        if (v.node && chain.has(v.id)) return [0, 1000];
        if (v.src) return [v.src.y + v.src.h / 2 + 34 + v.h / 2, 6];
        if (!v.nb.length) return [v.y, .1];
        let s = 0, w = 0;
        for (const [o, k] of v.nb) { s += o.y*k; w += k; }
        return [s / w, w];
      }));
    }
  }

  // Coordinates: y here is the centre of the vertex.
  let x = 0;
  cols.forEach(col => {
    for (const v of col) {
      v.x = x;
      if (v.node) { v.node.x = x; v.node.y = v.y - v.h / 2; }
    }
    x += W + GAP_X;
  });
  for (const e of edges) e.via = e.via.map(d => ({x:d.x + W / 2, y:d.y}));
  for (const n of nodes.values()) {
    const p = pins.get(n.id);
    if (p) { n.x = p.x; n.y = p.y; }
  }
}

/* ---------- Rendering ---------- */
const PICK = '<svg width="11" height="11" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M1.5 10.5 7 5M2.8 3.2c2.6-1.6 5-1.2 7 1-.1-3-1.900-4.700-5-4.500"/></svg>';
const proc = kind => (KIND[kind] || '').toLowerCase();
// Machines whose time does not follow RPM. A fan's RPM changes only how far its air reaches.
const NO_RPM = new Set(['spout', 'item_drain', 'furnace', 'blast_furnace', 'smoker', 'hand']);
function machineRows(n, kind){
  const rcBtn = '<button class="rc" data-rc="1" aria-label="Рецепт">&#9662;</button>';
  const row = (m, xText, extra, text, btn) => `<div class="mach">${machineIcon(m, 18)}<span class="name">${esc(MACH[m])}<span class="proc">${esc(text)}</span></span><span class="x">×${xText}${extra || ''}</span>${btn || ''}</div>`;
  const loads = n.loads || [];
  if (loads.length > 1) {
    const groups = new Map();
    for (const l of loads) {
      const key = l.machine + '|' + l.count;
      groups.set(key, {m:l.machine, c:l.count, steps:(groups.get(key) || {steps:0}).steps + 1});
    }
    return [...groups.values()].map((g, i) => row(g.m, g.c, '', `${proc(kind)}, ${g.steps} ${plural(g.steps, 'шаг', 'шага', 'шагов')}`, i === 0 ? rcBtn : '')).join('');
  }
  return loads.map(l => {
    const batch = l.machine === 'crushing_wheels' || l.machine === 'fan' ? `, партия ${l.items_per_op}` : '';
    return row(l.machine, l.count, '', proc(kind) + batch, rcBtn);
  }).join('');
}
// RPM, how full the machines are and stress, the same for recipes and generators.
function statsRows(loads, ownRpm, extraRight){
  const l = loads[0];
  const speed = NO_RPM.has(l.machine) ? '<span class="muted">от RPM не зависит</span>'
    : `<span class="${ownRpm ? 'own' : ''}">${fmt(l.rpm)} RPM${ownRpm ? ' (свой)' : ''}</span>`;
  const full = Math.max(...loads.map(x => x.count ? x.exact / x.count : 0));
  const su = loads.reduce((s, x) => s + x.su, 0);
  const pct = l.machine === 'hand' ? '' : `<span class="r2 ${full >= .95 ? 'tight' : ''}">загрузка ${Math.ceil(full * 100 - 1e-6)}%</span>`;
  const blocks = l.stream_blocks ? `<span class="r2">поток ${Math.ceil(l.stream_blocks)} бл.</span>` : '';
  return `<div class="stats">${speed}${pct || '<span></span>'}<span>${su ? fmt(su) + ' SU' : '<span class="muted">без SU</span>'}</span>${extraRight || blocks || '<span></span>'}</div>`;
}
function cardHtml(n){
  const head = `<div class="head">${itemIcon(n.res, 24)}<div><div class="t" title="${esc(nameOf(n.res))}">${esc(nameOf(n.res))}</div><div class="r">${rateText(n.res, n.rate)}</div></div></div>`;
  if (n.type === 'recipe') {
    const kind = recipes.get(n.recipe).kind;
    const burn = S.heat && n.burners ? `<span class="r2 heat">${n.heat === 'superheated' ? 'перегрев' : 'нагрев'} ×${n.burners}</span>` : '';
    return head + machineRows(n, kind) + statsRows(n.loads, !!(S.overrides[n.recipe] && S.overrides[n.recipe].rpm), burn);
  }
  if (n.type === 'surplus') return head + `<div class="sub">${n.byproduct ? 'побочный продукт (chance-выход)' : 'остаток производства'}</div>`;
  if (n.type === 'stock') return head + `<div class="sub green">со склада</div>`;
  const load = n.load ? `<div class="mach">${machineIcon(n.load.machine, 18)}<span class="name">${esc(MACH[n.load.machine])}<span class="proc">на генераторе</span></span><span class="x">×${n.load.count}</span></div>${statsRows([n.load], false)}` : '';
  return head + `<div class="sub green">${PICK}базовый ресурс — снабжение</div>` + load;
}
function renderNodes(){
  const box = $('nodes');
  box.innerHTML = [...G.nodes.values()].map(n => `<div class="node${n.goal ? ' goal' : ''}" data-id="${esc(n.id)}">${cardHtml(n)}</div>`).join('');
  box.querySelectorAll('.node').forEach(el => { const n = G.nodes.get(el.dataset.id); n.el = el; n.h = el.offsetHeight; });
}
function renderPositions(){
  for (const n of G.nodes.values()) { n.el.style.left = n.x + 'px'; n.el.style.top = n.y + 'px'; }
}
function bez(p0, c1, c2, p3, t){
  const u = 1 - t;
  return [u*u*u*p0[0] + 3*u*u*t*c1[0] + 3*u*t*t*c2[0] + t*t*t*p3[0], u*u*u*p0[1] + 3*u*u*t*c1[1] + 3*u*t*t*c2[1] + t*t*t*p3[1]];
}
function segments(points, shift){
  const out = [];
  for (let i = 0; i + 1 < points.length; i++) {
    const a = points[i], b = points[i + 1];
    const dx = b[0] > a[0] ? Math.max(36, (b[0] - a[0]) * .5) : 70;
    out.push([a, [a[0] + dx, a[1] + shift], [b[0] - dx, b[1] + shift], b]);
  }
  return out;
}
function polyline(segs){
  const pts = [];
  for (const s of segs) for (let i = 0; i <= 16; i++) pts.push(bez(s[0], s[1], s[2], s[3], i / 16));
  return pts;
}
const insideCard = (p, n, m) => p[0] > n.x - m && p[0] < n.x + W + m && p[1] > n.y - m && p[1] < n.y + n.h + m;
function renderEdges(){
  const nodes = [...G.nodes.values()], paths = [], arrows = [], labels = [], placed = [];
  const parallel = new Map();
  const list = G.edges.slice().sort((a, b) => (b.side - a.side) || (volume(a) - volume(b)));
  for (const e of list) {
    const key = e.from + '>' + e.to, idx = parallel.get(key) || 0;
    parallel.set(key, idx + 1);
    const a = G.nodes.get(e.from), b = G.nodes.get(e.to);
    const start = [a.x + W, a.y + a.h / 2], tip = [b.x, b.y + b.h / 2];
    const heft = Math.log10(volume(e) + 1);
    const len = e.side ? 11 : Math.min(21, 13 + heft * 2.4);
    const end = [tip[0] - len * .7, tip[1]];
    const shift = idx ? (idx % 2 ? 1 : -1) * Math.ceil(idx / 2) * 26 : 0;
    let segs = segments([start, end], shift);
    let pts = polyline(segs);
    const others = nodes.filter(n => n !== a && n !== b);
    if (e.via.length && pts.some(p => others.some(n => insideCard(p, n, 6)))) {
      segs = segments([start, ...e.via.map(v => [v.x, v.y]), end], shift);
      pts = polyline(segs);
    }
    const color = tint(iconColor(e.res));
    const width = e.side ? 1.4 : Math.min(3, 1.5 + heft * .55);
    const d = `M${segs[0][0][0]} ${segs[0][0][1]}` + segs.map(s => `C${s[1][0]} ${s[1][1]} ${s[2][0]} ${s[2][1]} ${s[3][0]} ${s[3][1]}`).join('');
    paths.push(`<path d="${d}" fill="none" stroke="${color}" stroke-width="${width.toFixed(2)}"${e.side ? ' stroke-dasharray="5 4"' : ''}/>`);
    const hw = len * .56;
    arrows.push(`<polygon points="${tip[0]},${tip[1]} ${tip[0] - len},${tip[1] - hw} ${tip[0] - len},${tip[1] + hw}" fill="${color}"/>`);
    // The label takes the first free spot around the middle of the curve.
    let spot = pts[Math.floor(pts.length / 2)];
    for (const t of [.5, .42, .58, .34, .66, .26, .74, .18, .82]) {
      const p = pts[Math.floor(pts.length * t)];
      const clear = !nodes.some(n => insideCard([p[0], p[1] + 8], n, 26)) && !placed.some(q => Math.abs(q[0] - p[0]) < 62 && Math.abs(q[1] - p[1]) < 36);
      if (clear) { spot = p; break; }
    }
    placed.push(spot);
    const txt = fmt(e.per_minute) + (unit(e.res) ? ' ' + unit(e.res) : '') + (e.side ? ' (побочн.)' : '');
    const t = e.transport;
    const extra = t ? [t.stack > 1 ? 'по ' + t.stack : '', t.belts > 1 ? 'лент: ' + t.belts : '', S.belt ? fmt(t.belt_rpm) + ' RPM' : ''].filter(Boolean).join(', ') : '';
    labels.push(`<div class="elabel" data-edge="${esc(edgeKey(e))}" style="left:${spot[0]}px;top:${spot[1]}px" title="${esc(nameOf(e.res))}">${itemIcon(e.res, 17)}<span class="n">${txt}</span>${extra ? `<span class="n t${t.needs_buffer ? ' warn' : ''}">${extra}</span>` : ''}</div>`);
  }
  $('edges').innerHTML = paths.join('') + arrows.join('');
  $('labels').innerHTML = labels.join('');
}
function applyView(){
  $('world').style.transform = `translate(${view.x}px,${view.y}px) scale(${view.k})`;
  // Far out, details are unreadable anyway: keep what identifies a card and make it bigger.
  $('world').classList.toggle('far', view.k < .6);
}
function fit(){
  const ns = [...G.nodes.values()];
  if (!ns.length) return;
  const x0 = Math.min(...ns.map(n => n.x)), x1 = Math.max(...ns.map(n => n.x + W));
  const y0 = Math.min(...ns.map(n => n.y)), y1 = Math.max(...ns.map(n => n.y + n.h));
  const top = 44, areaW = innerWidth - (panel ? 340 : 0), areaH = innerHeight - top;
  const pad = 36;
  const k = Math.max(.12, Math.min(1, (areaW - pad*2) / (x1 - x0), (areaH - pad*2) / (y1 - y0)));
  view = {k, x:(areaW - (x1 - x0)*k) / 2 - x0*k, y:top + (areaH - (y1 - y0)*k) / 2 - y0*k};
  applyView();
}
function zoomAt(cx, cy, factor){
  const k = Math.max(.12, Math.min(2.5, view.k * factor));
  view.x = cx - (cx - view.x) * k / view.k;
  view.y = cy - (cy - view.y) * k / view.k;
  view.k = k;
  applyView();
}

/* ---------- Totals and panel ---------- */
function renderTotals(){
  if (!plan) return;
  const n = Object.values(plan.machines).reduce((s, v) => s + v, 0);
  let txt = `${fmt(plan.total_su)} SU · ${fmt(n)} ${plural(n, 'машина', 'машины', 'машин')}`;
  if (plan.heat) { const b = plan.heat.burners_heated + plan.heat.burners_superheated; txt += ` · бёрнеры ${b}`; }
  const warn = plan.warnings.length + plan.manual.length;
  $('totals').innerHTML = esc(txt) + (warn ? `<span class="w">!</span>` : '');
  $('totals').classList.toggle('on', !!panel && panel.kind === 'load');
}
function warnText(w){
  return w.replace(/^(.+): not a usual resource and no way to craft it was found$/, (_, id) => `${nameOf(id)}: необычный ресурс, рецепт не найден`)
          .replace(/^(.+): fan stream is too short for any belt speed$/, (_, id) => `${id}: поток вентилятора слишком короткий для любой скорости ленты`);
}
function loadPanel(){
  const by = new Map();
  for (const n of plan.nodes) for (const l of n.loads || (n.load ? [n.load] : [])) {
    const e = by.get(l.machine) || {c:0, su:0};
    e.c += l.count; e.su += l.su; by.set(l.machine, e);
  }
  const rows = [...by].sort((a, b) => b[1].su - a[1].su).map(([m, e]) => `<div class="row">${machineIcon(m, 18)}<span>${esc(MACH[m] || m)}</span><span class="d">×${fmt(e.c)}</span><span class="v p">${fmt(e.su)} SU</span></div>`).join('');
  let h = `<div class="ph"><h2>Нагрузка и здания</h2></div><div class="row"><span>Всего</span><span class="v p">${fmt(plan.total_su)} SU</span></div><h3>SU по машинам</h3>${rows || '<div class="note">Машин нет</div>'}`;
  if (power) {
    h += `<h3>Чем покрыть нагрузку (любой один вариант)</h3>` + power.sources.map(s => `<div class="row"><span>${esc(SOURCES[s.id] || readable(s.id))}</span><span class="d">${fmt(s.su_each)} SU</span><span class="v p">×${fmt(s.count)}</span></div>`).join('');
    const b = power.boilers;
    h += `<div class="note">Котёл: уровней ${b.levels}, двигателей ${b.engines}, бак ${b.tank_blocks} бл., вода ${b.water_mb_per_tick} мБ/тик, бёрнеров ${b.burners_kindled} (или ${b.burners_seething} раскалённых)</div>`;
  }
  if (plan.heat) {
    const t = plan.heat;
    h += `<h3>Нагрев</h3><div class="row"><span>Бёрнеры, нагрев</span><span class="v p">${t.burners_heated}</span></div><div class="row"><span>Бёрнеры, перегрев</span><span class="v p">${t.burners_superheated}</span></div><div class="row"><span>Уголь</span><span class="v p">${fmt(t.coal_per_min)}/мин</span></div><div class="row"><span>Торт ифрита</span><span class="v p">${fmt(t.cake_per_min)}/мин</span></div>`;
  }
  if (S.mode === 'full_auto') {
    h += `<h3>Нужна ручная добыча</h3>` + (plan.manual.length ? plan.manual.map(id => `<div class="row">${itemIcon(id, 18)}<span>${esc(nameOf(id))}</span></div>`).join('') : '<div class="note">Не требуется</div>');
  }
  if (plan.warnings.length) h += `<h3>Предупреждения</h3>` + plan.warnings.map(w => `<div class="warn">${esc(warnText(w))}</div>`).join('');
  return h;
}
function flowRows(list, side){
  return list.map(e => {
    const other = side === 'in' ? G.nodes.get(e.from) : G.nodes.get(e.to);
    const note = e.side ? 'побочн.' : '';
    return `<div class="row">${itemIcon(e.res, 18)}<span>${esc(nameOf(e.res))}</span>${note ? `<span class="d">${note}</span>` : ''}<span class="v" title="${esc(nameOf(other.res))}">${rateText(e.res, e.per_minute)}</span></div>`;
  }).join('');
}
function recipeLabel(id){
  const r = recipes.get(id);
  if (!r) return readable(id);
  const inputs = r.inputs.map(s => nameOf(s.res)).join(' + ');
  return `${KIND[r.kind] || r.kind}: ${inputs || id}`;
}
function nodePanel(n){
  let h = `<div class="ph">${itemIcon(n.res, 28)}<div><h2>${esc(nameOf(n.res))}</h2><div style="color:var(--blue)">${rateText(n.res, n.rate)}</div></div></div>`;
  const ins = n.ins, outs = n.outs;
  if (n.type === 'recipe') {
    const over = S.overrides[n.recipe] || {};
    const opts = [n.recipe, ...n.alternatives];
    h += `<h3>Рецепт</h3><select id="pRecipe">${opts.map(o => `<option value="${esc(o)}"${o === n.recipe ? ' selected' : ''}>${esc(recipeLabel(o))}</option>`).join('')}</select>`;
    if (n.machine_options.length) h += `<h3>Машина</h3><select id="pMachine">${n.machine_options.map(m => `<option value="${m}"${m === n.loads[0].machine ? ' selected' : ''}>${esc(machineName(m, recipes.get(n.recipe).kind))}</option>`).join('')}</select>`;
    h += `<h3>Свой RPM</h3><input id="pRpm" class="inp" type="number" min="1" max="256" step="any" placeholder="Общий: ${fmt(S.rpm)}" value="${over.rpm ?? ''}">`;
    const l = n.loads[0];
    if (l.ticks) {
      const perUnit = l.items_per_op * 1200 / l.ticks;
      h += `<h3>Скорость</h3><div class="row"><span>${NO_RPM.has(l.machine) ? 'От RPM не зависит' : 'RPM'}</span><span class="v">${NO_RPM.has(l.machine) ? '' : fmt(l.rpm)}</span></div>`;
      h += `<div class="row"><span>Цикл</span><span class="v">${fmt(l.ticks)} тиков</span></div>`;
      h += `<div class="row"><span>${l.machine === 'fan' ? 'На блок потока' : 'На машину'}</span><span class="v p">${fmt(perUnit)}/мин</span></div>`;
      if (l.machine === 'fan') h += `<div class="note">RPM вентилятора меняет только дальность потока, время обработки от него не зависит.</div>`;
    }
    if (n.loads.length === 1 && (l.machine === 'crushing_wheels' || l.machine === 'fan')) {
      const cur = over.batch || 1;
      h += `<h3>Партия</h3><div class="seg" id="pBatch">${[1, 4, 16, 64].map(b => `<button data-v="${b}"${b === cur ? ' class="on"' : ''}>${b}</button>`).join('')}</div>`;
    }
    if (n.loads.length > 1) h += `<h3>Шаги сборки</h3>` + n.loads.map((s, i) => `<div class="row">${machineIcon(s.machine, 18)}<span>${i + 1}. ${esc(MACH[s.machine])}</span><span class="d">${fmt(s.su)} SU</span><span class="v p">×${s.count}</span></div>`).join('');
    if (l.stream_blocks) h += `<h3>Вентилятор</h3><div class="row"><span>Длина потока</span><span class="v p">${fmt(l.stream_blocks)} бл.</span></div><div class="row"><span>Максимум RPM ленты</span><span class="v p">${fmt(l.max_belt_rpm)}</span></div>`;
    h += `<h3>Входы</h3>${flowRows(ins, 'in') || '<div class="note">Нет</div>'}`;
    h += `<h3>Выходы</h3>${flowRows(outs, 'out') || `<div class="note">Только конечная цель</div>`}`;
    h += `<div class="btns"><button class="btn" id="pStock">Со склада</button><button class="btn" id="pReset">Сбросить</button></div>`;
  } else if (n.type === 'surplus') {
    h += `<h3>Откуда</h3>${flowRows(ins, 'in')}`;
  } else {
    const inStock = n.type === 'stock', item = items.get(n.res);
    const can = !!(item && item.has_recipe);
    h += `<h3>Куда идёт</h3>${flowRows(outs, 'out') || '<div class="note">Только конечная цель</div>'}`;
    if (n.load) h += `<h3>Генератор</h3><div class="row">${machineIcon(n.load.machine, 18)}<span>${esc(MACH[n.load.machine])}</span><span class="d">${fmt(n.load.su)} SU</span><span class="v p">×${n.load.count}</span></div>`;
    h += `<div class="btns">`;
    if (inStock) h += `<button class="btn" id="pUnstock">Убрать со склада</button>`;
    else h += `<button class="btn" id="pStock">Со склада</button>`;
    h += `<button class="btn" id="pCraft"${can && !inStock ? '' : ' disabled'}>Скрафтить</button></div><div class="note" id="pNote">${can ? '' : 'Рецепта для этого предмета нет.'}</div>`;
  }
  return h;
}
function renderPanel(){
  const el = $('panel');
  el.classList.toggle('open', !!panel);
  renderTotals();
  document.querySelectorAll('.node').forEach(c => c.classList.toggle('sel', !!panel && panel.id === c.dataset.id));
  if (!panel || !plan) return;
  if (panel.kind === 'edge') {
    const e = G.edges.find(x => edgeKey(x) === panel.key);
    if (!e) { panel = null; el.classList.remove('open'); return; }
    $('panelBody').innerHTML = edgePanel(e);
    bindEdgePanel(e);
    return;
  }
  const n = panel.kind === 'node' ? G.nodes.get(panel.id) : null;
  if (panel.kind === 'node' && !n) { panel = null; el.classList.remove('open'); return; }
  $('panelBody').innerHTML = n ? nodePanel(n) : loadPanel();
  if (!n) return;
  panel.res = n.res;
  bindNodePanel(n);
  if (n.type === 'recipe') {
    // Alternatives are labelled once their recipes arrive.
    const missing = n.alternatives.filter(a => !recipes.has(a));
    if (missing.length && !offline) Promise.all(missing.map(loadRecipe)).then(() => { if (panel && panel.id === n.id) renderPanel(); }).catch(() => {});
  }
}
function setOverride(recipe, key, value){
  const o = S.overrides[recipe] = S.overrides[recipe] || {};
  if (value === null) delete o[key]; else o[key] = value;
  if (!Object.keys(o).length) delete S.overrides[recipe];
  replan();
}
function bindNodePanel(n){
  const on = (id, ev, fn) => { const el = $(id); if (el) el.addEventListener(ev, fn); };
  on('pRecipe', 'change', e => { S.choice[n.res] = e.target.value; replan(); });
  on('pMachine', 'change', e => setOverride(n.recipe, 'machine', e.target.value));
  on('pRpm', 'change', e => { const v = parseFloat(e.target.value); setOverride(n.recipe, 'rpm', v > 0 ? v : null); });
  on('pBatch', 'click', e => { const v = +e.target.dataset.v; if (v) setOverride(n.recipe, 'batch', v === 1 ? null : v); });
  on('pStock', 'click', () => { if (!S.stock.includes(n.res)) S.stock.push(n.res); replan(); });
  on('pUnstock', 'click', () => { S.stock = S.stock.filter(r => r !== n.res); replan(); });
  on('pReset', 'click', () => { delete S.choice[n.res]; delete S.overrides[n.recipe]; replan(); });
  on('pCraft', 'click', async () => {
    try {
      const list = await api('/api/producers?item=' + encodeURIComponent(n.res));
      if (!list.length) { $('pNote').textContent = 'Подходящий рецепт не найден.'; return; }
      list.forEach(r => recipes.set(r.id, r));
      $('pNote').innerHTML = `<h3>Рецепт</h3><select id="pCraftList"><option value="">Выберите рецепт</option>${list.map(r => `<option value="${esc(r.id)}">${esc(recipeLabel(r.id))}</option>`).join('')}</select>`;
      $('pCraftList').addEventListener('change', e => {
        if (!e.target.value) return;
        S.choice[n.res] = e.target.value;
        S.stock = S.stock.filter(r => r !== n.res);
        replan();
      });
    } catch (e) { $('pNote').textContent = e.http ? e.message : 'Сервер недоступен.'; }
  });
}
function openNode(id, focusRecipe){
  const n = G.nodes.get(id);
  if (!n) return;
  panel = {kind:'node', id, res:n.res};
  renderPanel();
  const r = n.el.getBoundingClientRect(), limit = innerWidth - 340 - 16;
  if (r.right > limit) { view.x -= r.right - limit; applyView(); }
  if (focusRecipe && $('pRecipe')) $('pRecipe').focus();
}
function closePanel(){ panel = null; renderPanel(); }
const edgeKey = e => e.from + '|' + e.to + '|' + e.res;
function openEdge(key){ panel = {kind:'edge', key}; renderPanel(); }
function edgePanel(e){
  const a = G.nodes.get(e.from), b = G.nodes.get(e.to), t = e.transport;
  let h = `<div class="ph">${itemIcon(e.res, 28)}<div><h2>${esc(nameOf(e.res))}</h2><div style="color:var(--blue)">${rateText(e.res, e.per_minute)}</div></div></div>`;
  h += `<h3>Поток</h3><div class="row"><span>Откуда</span><span class="v">${esc(nameOf(a.res))}</span></div><div class="row"><span>Куда</span><span class="v">${esc(nameOf(b.res))}</span></div>`;
  if (!t) return h + `<div class="note">Жидкость идёт по трубам, они не считаются.</div>`;
  h += `<h3>Размер стопки</h3><div class="seg" id="eStack">${[1, 4, 16, 64].map(s => `<button data-v="${s}"${s === t.stack ? ' class="on"' : ''}>${s}</button>`).join('')}</div><div class="note">Для всех потоков этого предмета.</div>`;
  h += `<h3>Лента и воронки</h3>`;
  h += `<div class="row"><span>Лент при ${fmt(t.belt_rpm)} RPM</span><span class="v p">${t.belts}</span></div>`;
  h += `<div class="row"><span>Хватит одной от</span><span class="v">${fmt(t.min_belt_rpm)} RPM</span></div>`;
  h += `<div class="row"><span>Воронок на загрузку</span><span class="v p">${t.funnels}</span></div>`;
  if (t.needs_buffer) h += `<div class="note warn">Источник отдаёт меньше стопки за раз, а на ленте стопки сами не собираются. Нужен ящик и воронка с фильтром на ${t.stack} шт.</div>`;
  if (S.stacks[e.res]) h += `<div class="btns"><button class="btn" id="eReset">Сбросить</button></div>`;
  return h;
}
function bindEdgePanel(e){
  const seg = $('eStack');
  if (seg) seg.addEventListener('click', ev => { const v = +ev.target.dataset.v; if (v) { S.stacks[e.res] = v; replan(); } });
  const reset = $('eReset');
  if (reset) reset.addEventListener('click', () => { delete S.stacks[e.res]; replan(); });
}

/* ---------- Canvas interaction ---------- */
function bindCanvas(){
  const cv = $('canvas');
  let drag = null;
  cv.addEventListener('pointerdown', e => {
    if (e.button !== 0 && e.button !== 1) return;
    const card = e.target.closest('.node');
    const n = card && G.nodes.get(card.dataset.id);
    const label = e.target.closest('.elabel');
    drag = n ? {n, sx:e.clientX, sy:e.clientY, ox:n.x, oy:n.y, moved:false, rc:!!e.target.closest('[data-rc]')}
             : {pan:true, edge:label && label.dataset.edge, sx:e.clientX, sy:e.clientY, ox:view.x, oy:view.y, moved:false};
    cv.setPointerCapture(e.pointerId);
    if (!n) cv.classList.add('pan');
  });
  cv.addEventListener('pointermove', e => {
    if (!drag) return;
    const dx = e.clientX - drag.sx, dy = e.clientY - drag.sy;
    if (!drag.moved && Math.hypot(dx, dy) < 4) return;
    drag.moved = true;
    if (drag.pan) { view.x = drag.ox + dx; view.y = drag.oy + dy; applyView(); return; }
    const n = drag.n;
    n.x = drag.ox + dx / view.k; n.y = drag.oy + dy / view.k;
    pins.set(n.id, {x:n.x, y:n.y});
    n.el.style.left = n.x + 'px'; n.el.style.top = n.y + 'px';
    renderEdges();
  });
  const up = () => {
    if (!drag) return;
    cv.classList.remove('pan');
    if (!drag.moved) { if (drag.n) openNode(drag.n.id, drag.rc); else if (drag.edge) openEdge(drag.edge); else if (panel) closePanel(); }
    drag = null;
  };
  cv.addEventListener('pointerup', up);
  cv.addEventListener('pointercancel', up);
  cv.addEventListener('wheel', e => { e.preventDefault(); zoomAt(e.clientX, e.clientY, Math.exp(-e.deltaY * .0012)); }, {passive:false});
  $('zIn').onclick = () => zoomAt(innerWidth / 2, innerHeight / 2, 1.2);
  $('zOut').onclick = () => zoomAt(innerWidth / 2, innerHeight / 2, 1 / 1.2);
  $('zFit').onclick = fit;
}

/* ---------- Controls ---------- */
function setTarget(id, name){
  S.item = id; S.itemName = name;
  S.stock = []; S.choice = {}; S.overrides = {};
  pins.clear(); panel = null;
  syncControls();
  replan({fit:true});
}
function syncControls(){
  const name = S.itemName || nameOf(S.item);
  $('search').value = name;
  $('searchIcon').innerHTML = icon(S.item, name, 20);
  $('per').value = S.per; $('rpm').value = S.rpm; $('belt').value = S.belt ?? ''; $('belt').placeholder = S.rpm; $('heat').checked = S.heat;
  document.querySelectorAll('#mode button').forEach(b => b.classList.toggle('on', b.dataset.v === S.mode));
}
function bindControls(){
  const input = $('search'), box = $('sugg');
  let timer = 0, list = [], active = 0;
  const hide = () => { box.style.display = 'none'; };
  const paint = () => {
    box.innerHTML = list.map((it, i) => `<div class="${i === active ? 'on' : ''}" data-i="${i}">${icon(it.id, it.name, 20)}<span>${esc(it.name === it.id ? readable(it.id) : it.name)}</span><small>${esc(it.id.split(':')[0])}</small></div>`).join('');
    box.style.display = list.length ? 'block' : 'none';
    const on = box.querySelector('.on');
    if (on) on.scrollIntoView({block:'nearest'});
  };
  // Names show in English, but a Russian query must still find the item.
  const query = q => {
    const url = lang => api(`/api/items?lang=${lang}&limit=14&q=${encodeURIComponent(q.trim())}`);
    return Promise.all([url('en'), url('ru')]).then(([en, ru]) => {
      const seen = new Set(en.map(i => i.id));
      list = en.concat(ru.filter(i => !seen.has(i.id)).map(i => items.get(i.id) || i)).slice(0, 14);
      active = 0; paint();
    }).catch(() => { list = []; hide(); });
  };
  input.addEventListener('focus', () => { input.select(); query(''); });
  input.addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(() => query(input.value), 130); });
  input.addEventListener('keydown', e => {
    if (e.key === 'ArrowDown' && list.length) { active = (active + 1) % list.length; paint(); e.preventDefault(); }
    else if (e.key === 'ArrowUp' && list.length) { active = (active - 1 + list.length) % list.length; paint(); e.preventDefault(); }
    else if (e.key === 'Enter' && list[active]) { const it = list[active]; hide(); input.blur(); setTarget(it.id, it.name); }
    else if (e.key === 'Escape') { hide(); input.blur(); syncControls(); }
  });
  box.addEventListener('pointerdown', e => {
    const row = e.target.closest('[data-i]');
    if (!row) return;
    e.preventDefault();
    const it = list[+row.dataset.i]; hide(); input.blur(); setTarget(it.id, it.name);
  });
  input.addEventListener('blur', () => { setTimeout(hide, 100); syncControls(); });
  let numTimer = 0;
  const num = (id, key) => $(id).addEventListener('input', e => {
    const v = parseFloat(e.target.value);
    if (!(v > 0)) return;
    S[key] = v;
    clearTimeout(numTimer); numTimer = setTimeout(() => replan(), 250);
  });
  num('per', 'per'); num('rpm', 'rpm');
  $('belt').addEventListener('input', e => {
    const v = parseFloat(e.target.value);
    S.belt = v > 0 ? v : null;
    clearTimeout(numTimer); numTimer = setTimeout(() => replan(), 250);
  });
  $('mode').addEventListener('click', e => { const v = e.target.dataset.v; if (v && v !== S.mode) { S.mode = v; syncControls(); replan(); } });
  $('heat').addEventListener('change', e => { S.heat = e.target.checked; replan(); });
  $('totals').addEventListener('click', () => { if (panel && panel.kind === 'load') closePanel(); else { panel = {kind:'load'}; renderPanel(); } });
  $('close').addEventListener('click', closePanel);
  addEventListener('keydown', e => { if (e.key === 'Escape' && panel && document.activeElement !== input) closePanel(); });
}

/* ---------- Start. The hash can preset a scenario: #item=...&per=...&rpm=...&mode=...&open=<node id>&panel=load ---------- */
async function start(){
  const h = new URLSearchParams(location.hash.slice(1));
  if (h.get('item')) S.item = h.get('item');
  if (h.get('per')) S.per = +h.get('per');
  if (h.get('rpm')) S.rpm = +h.get('rpm');
  if (h.get('mode')) S.mode = h.get('mode');
  if (h.get('heat') === '0') S.heat = false;
  if (h.get('belt')) S.belt = +h.get('belt');
  if (h.get('stack')) S.stacks = JSON.parse(h.get('stack'));
  bindCanvas(); bindControls(); syncControls(); applyView();
  await replan({fit:true});
  syncControls();
  if (h.get('open')) openNode(h.get('open'));
  if (h.get('edge')) openEdge(h.get('edge'));
  if (h.get('panel') === 'load') { panel = {kind:'load'}; renderPanel(); }
}
start();
</script>
