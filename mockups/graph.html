<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Create: граф производства</title>
<style>
:root{--bg:#121417;--card:#1b1e23;--line:#2e3238;--line2:#3b4048;--text:#e4e6e9;--dim:#a3a8b0;--blue:#5ca6ee;--orange:#eda83c;--green:#6fd08a;--gold:#d9b65a;--red:#e07a6a}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:12px/1.35 "Segoe UI",system-ui,sans-serif;overflow:hidden}
button,input,select{font:inherit;color:inherit}
#canvas{position:fixed;inset:0;cursor:grab;touch-action:none;background:var(--bg)}
#canvas.pan{cursor:grabbing}
#world{position:absolute;left:0;top:0;width:1px;height:1px;transform-origin:0 0}
#edges{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible;pointer-events:none}
#labels{position:absolute;left:0;top:0;pointer-events:none}
.elabel{position:absolute;display:flex;flex-direction:column;align-items:center;transform:translate(-50%,-9px);color:#8f949b;font-size:10.5px;white-space:nowrap}
.elabel{pointer-events:auto;cursor:pointer}
.elabel span.t{color:var(--blue)}
.elabel span.warn,.note.warn{color:#d9a441}
.elabel span.n{margin-top:1px;padding:0 2px;background:var(--bg);border-radius:2px;line-height:13px}
.ic{display:inline-flex;align-items:center;justify-content:center;flex:none;border-radius:2px;font-weight:600;line-height:1;letter-spacing:-.02em;user-select:none}
.node{position:absolute;width:260px;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:9px 10px 7px;cursor:pointer;user-select:none}
.node:active{cursor:grabbing}
.node:hover{border-color:var(--line2)}
.node>.mach:first-child{border-top:0;margin-top:0;padding-top:0}
.outs{border-top:1px solid var(--line);margin-top:6px;padding-top:4px}
.outs .lbl{color:var(--dim);font-size:11px;line-height:15px;margin-bottom:2px}
.outs .head+.head{margin-top:4px}
.far .outs .lbl{visibility:hidden}
.node.by{background:#17191c}
.node.by .head .t{color:#b4b8be;font-weight:500}
.node.by .head .r{color:#9ea3ab}
.node.goal{border-color:var(--gold);border-width:1.5px;padding:8.5px 9.5px 6.5px}
.node.sel{border-color:#9fb2c6}
.node.goal.sel{border-color:#f0d58a}
.head{display:flex;align-items:center;gap:9px}
.head>div{flex:1;min-width:0;display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.head .t{font-size:14px;font-weight:600;line-height:18px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.head .r{color:var(--blue);font-size:13px;line-height:18px;white-space:nowrap;flex:none}
.sub{margin-top:7px;font-size:11.5px;color:var(--dim);line-height:14px}
.sub.green{color:var(--green)}
.sub svg{vertical-align:-2px;margin-right:3px}
.mach{display:flex;align-items:center;gap:6px;border-top:1px solid var(--line);margin-top:7px;padding-top:6px;min-height:30px}
.mach+.mach{border-top:0;margin-top:0;padding-top:1px}
.mach .name{flex:1;min-width:0;font-size:13px;line-height:17px}
.mach .proc{display:block;color:var(--dim);font-size:11.5px;line-height:15px}
.mach .x{color:var(--orange);font-weight:600;font-size:17px;white-space:nowrap;text-align:right;line-height:20px}
.mach .x small{display:block;color:var(--dim);font-weight:400;font-size:11px;line-height:13px}
.rc{flex:none;align-self:stretch;background:none;border:0;padding:0 0 0 3px;color:var(--dim);font-size:12px;cursor:pointer}
.rc:hover{color:var(--text)}
.stats{display:grid;grid-template-columns:1fr auto;gap:1px 10px;border-top:1px solid var(--line);margin-top:6px;padding-top:5px;font-size:12px;line-height:17px;color:var(--text)}
.stats .r2{text-align:right}
.stats .own{color:var(--gold)}
.stats .muted{color:var(--dim)}
.stats .tight{color:#d9a441}
.stats .heat{color:var(--orange)}
.far .stats,.far .proc{visibility:hidden}
.far .head .t{font-size:18px}
.far .head .r{font-size:16px}
/* Bar */
#bar{position:fixed;left:0;right:0;top:0;height:44px;display:flex;align-items:center;gap:14px;padding:0 12px;background:#17191d;border-bottom:1px solid var(--line);z-index:5}
.fld{display:flex;align-items:center;gap:6px;color:var(--dim)}
.inp{height:28px;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:0 7px;color:var(--text);outline:0}
.inp:focus{border-color:#5a6470}
input[type=number]{appearance:textfield}
input[type=number]::-webkit-inner-spin-button{display:none}
#search{width:270px;padding-left:31px}
#searchWrap{position:relative}
#searchIcon{position:absolute;left:6px;top:4px;display:flex}
#sugg{position:absolute;left:0;top:32px;width:330px;background:var(--card);border:1px solid var(--line2);border-radius:6px;padding:3px;display:none;max-height:380px;overflow:auto}
#sugg div{display:flex;align-items:center;gap:8px;padding:4px 6px;border-radius:3px;cursor:pointer}
#sugg div small{margin-left:auto;color:var(--dim);font-size:10px}
#sugg div.on{background:#2a2e35}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.seg button{background:var(--bg);border:0;border-left:1px solid var(--line);height:26px;padding:0 10px;color:var(--dim);cursor:pointer}
.seg button:first-child{border-left:0}
.seg button.on{background:#2a2e35;color:var(--text)}
.chk{display:flex;align-items:center;gap:6px;color:var(--text);cursor:pointer}
.chk input{margin:0;accent-color:var(--orange)}
#totals{margin-left:auto;height:30px;background:none;border:1px solid var(--line);border-radius:4px;padding:0 10px;cursor:pointer;white-space:nowrap}
#totals:hover,#totals.on{border-color:var(--line2);background:#22252b}
#totals .w{color:var(--red);margin-left:6px}
/* Panel */
#panel{position:fixed;right:0;top:44px;bottom:0;width:340px;background:#17191d;border-left:1px solid var(--line);z-index:4;overflow:auto;padding:12px 14px 20px;display:none}
#panel.open{display:block}
#panel h2{font-size:12.5px;font-weight:600;margin:0}
#panel h3{font-size:10.5px;font-weight:400;color:var(--dim);margin:16px 0 5px}
.ph{display:flex;align-items:center;gap:9px;padding-right:24px;min-height:30px}
#close{position:absolute;right:9px;top:12px;width:24px;height:24px;background:none;border:0;color:var(--dim);cursor:pointer;font-size:15px}
#close:hover{color:var(--text)}
.row{display:flex;align-items:center;gap:7px;padding:2px 0;min-height:21px}
.row .v{margin-left:auto;white-space:nowrap;color:var(--blue)}
.row .v.p{color:var(--text)}
.row .d{color:var(--dim);font-size:10.5px}
#panel select,#panel .inp{width:100%}
#panel select{height:28px;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:0 3px}
#panel select option{background:var(--card)}
.btn{height:28px;background:#22252b;border:1px solid var(--line2);border-radius:4px;padding:0 11px;cursor:pointer}
.btn:hover:not(:disabled){background:#2c3037}
.btn:disabled{opacity:.45;cursor:default}
.btns{display:flex;gap:7px;flex-wrap:wrap;margin-top:16px}
.note{color:var(--dim);font-size:10.5px;margin-top:4px}
.warn{color:var(--red);font-size:11px;margin:3px 0}
/* Bottom */
#side{position:fixed;left:12px;top:56px;width:290px;max-height:calc(100vh - 118px);overflow:auto;background:#17191d;border:1px solid var(--line2);border-radius:8px;z-index:4}
#side details+details{border-top:1px solid var(--line)}
#side summary{list-style:none;cursor:pointer;padding:10px 12px;font-size:13px;font-weight:600;display:flex;justify-content:space-between;align-items:center;user-select:none}
#side summary::-webkit-details-marker{display:none}
#side summary::after{content:"\25BE";color:var(--dim)}
#side details:not([open]) summary::after{content:"\25B8"}
#side summary:hover{background:#1f2227}
#side .sb{padding:0 12px 12px}
#side h3{font-size:11px;font-weight:400;color:var(--dim);margin:10px 0 4px}
#side .line{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:30px;font-size:12px}
#side .chk.line{justify-content:flex-start}
#side .inp{width:70px}
#side .seg button{padding:0 8px}
.btn.file{display:inline-flex;align-items:center;font-size:12px}
.btn.file input{display:none}
.inp.wide{width:100%;margin-top:8px}
.seg.wide{display:flex;margin-top:8px}
.seg.wide button{flex:1;padding:0 4px;font-size:11.5px}
.rcp{border:1px solid var(--line);border-radius:6px;padding:6px 8px;margin-top:6px;background:var(--card)}
.rcp[hidden]{display:none}
.rl{display:flex;justify-content:space-between;align-items:center;min-height:24px;gap:6px}
.rt{min-width:0}
.rn{font-weight:600;font-size:12.5px}
.rk{display:block}
#ask{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:20}
#ask[hidden]{display:none}
#askBox{width:420px;max-width:calc(100vw - 32px);max-height:calc(100vh - 80px);overflow:auto;background:#17191d;border:1px solid var(--line2);border-radius:8px;padding:14px 16px}
#askBox h2{font-size:14px;margin:0 0 4px}
#askBox h3{font-size:11px;font-weight:400;color:var(--dim);margin:12px 0 4px}
#askBox .btns{justify-content:flex-end}
.btn.yes{background:#2d4a33;border-color:#3f6b49}
.rf{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:3px}
.rf .ar{color:var(--dim)}
.chip{display:inline-flex;align-items:center;gap:3px;font-size:11.5px}
.go{cursor:pointer}
.chip.go:hover,.row.go:hover{color:var(--blue)}
.btn.sm{height:22px;padding:0 7px;font-size:11px}
.qty{display:flex;gap:6px;flex-wrap:wrap}
.qty .inp{flex:1;min-width:120px}
.qty .btn.on{border-color:var(--gold);color:var(--gold)}
.rc.x{align-self:center;font-size:14px;padding:0 0 0 6px}
#status{position:fixed;left:12px;bottom:10px;color:var(--dim);z-index:3;max-width:60%}
#status.err{color:var(--red)}
#zoom{position:fixed;left:12px;bottom:32px;display:flex;gap:4px;z-index:3;align-items:center;color:var(--dim)}
#zoom button{height:24px;min-width:24px;background:#17191d;border:1px solid var(--line);border-radius:4px;cursor:pointer;color:var(--dim)}
#zoom button:hover{color:var(--text)}
</style>
</head>
<body>
<div id="canvas"><div id="world"><svg id="edges"></svg><div id="labels"></div><div id="nodes"></div></div></div>
<header id="bar">
  <div id="searchWrap"><span id="searchIcon"></span><input id="search" class="inp" placeholder="Что производить" autocomplete="off" spellcheck="false" aria-label="Цель"><div id="sugg"></div></div>
  <label class="fld"><input id="per" class="inp" type="number" min="0.01" step="any" style="width:64px"> в минуту</label>
  <label class="fld"><input id="rpm" class="inp" type="number" min="1" step="any" style="width:58px"> RPM</label>
  <div class="seg" id="mode"><button data-v="normal">Обычный</button><button data-v="full_auto">Полная автоматизация</button></div>
  <button id="jeiBtn" class="btn">Рецепты</button>
  <button id="totals" title="Нагрузка и здания"></button>
</header>
<div id="ask" hidden><div id="askBox" role="dialog" aria-modal="true"></div></div>
<aside id="side">
  <details id="sBr" open hidden><summary>Отростки</summary><div class="sb" id="brBody"></div></details>
  <details id="sMat" open><summary>Материалы</summary><div class="sb">
    <h3>Что построить</h3><div id="matBuild"></div>
    <h3>Материалы на всю постройку</h3><div id="matRaw"></div>
    <div class="note">Лента указана по числу линий. Валы, трубы, насосы, источники энергии и то, что стоит в потоке вентиляторов (вода, лава, огонь), не входят.</div>
    <div class="btns"><button class="btn" id="bCopy">Скопировать</button></div><div class="note" id="bNote"></div>
  </div></details>
  <details id="sSet"><summary>Настройки</summary><div class="sb">
    <h3>Схема</h3>
    <label class="chk line"><input id="heat" type="checkbox"> Нагрев: бёрнеры и топливо</label>
    <label class="chk line"><input id="cAsk" type="checkbox"> Спрашивать перед сменой рецепта</label>
    <label class="fld line"><span>RPM лент</span><input id="belt" class="inp" type="number" min="1" step="any"></label>
    <div class="fld line"><span title="Для дробилки и вентилятора">Партия машин</span><div class="seg" id="dBatch"></div></div>
    <div class="fld line"><span>Стопка на ленте</span><div class="seg" id="dStack"></div></div>
    <label class="fld line"><span>Парусов на мельницу</span><input id="cSails" class="inp" type="number" min="8" step="8"></label>
    <h3>Конфиг Create</h3>
    <label class="fld line"><span>Предел RPM</span><input id="cMax" class="inp" type="number" min="1" step="any"></label>
    <label class="fld line"><span>Время вентилятора, тиков</span><input id="cFan" class="inp" type="number" min="1" step="1"></label>
    <label class="chk line"><input id="cBulkPress" type="checkbox"> Пресс берёт стопку целиком</label>
    <label class="chk line"><input id="cBulkCut" type="checkbox"> Пила берёт стопку целиком</label>
    <label class="chk line"><input id="cSquare" type="checkbox"> Квадратные рецепты в прессе</label>
    <label class="chk line"><input id="cShapeless" type="checkbox"> Бесформенные рецепты в миксере</label>
    <label class="chk line"><input id="cCrafter" type="checkbox"> Обычный крафт в крафтере</label>
    <label class="chk line"><input id="cStone" type="checkbox"> Камнерез на пиле</label>
    <div class="btns"><label class="btn file">Загрузить create-server.toml<input id="cFile" type="file" accept=".toml"></label><button class="btn" id="cReset">Сбросить</button></div>
    <div class="note" id="cNote">Значения Create по умолчанию.</div>
  </div></details>
</aside>
<aside id="panel"><button id="close" aria-label="Закрыть">&times;</button><div id="panelBody"></div></aside>
<div id="zoom"><button id="zOut" aria-label="Отдалить">&minus;</button><button id="zIn" aria-label="Приблизить">+</button><button id="zFit">Вписать</button></div>
<div id="status"></div>

function buildGraph(p){

    const m = {...n, res:nodeRes(n), goal:goals.has(n.id), h:100, x:0, y:0, ins:[], outs:[]};
    m.rate = n.type === 'recipe' ? outputRate(n, recipes.get(n.recipe), m.res) : n.per_minute;
    nodes.set(n.id, m);
  }
  // A by-product is what the scheme neither uses nor asked for, so only those edges are dashed.
  const edges = [];
  for (const e of p.edges) {
    const src = nodes.get(e.from);
    if (!src) continue;
    const toEnd = e.to.startsWith('surplus:');
    // Every output the scheme does use is listed on the recipe's card.
    if (!toEnd && src.type === 'recipe' && e.res !== src.res) {
      src.more = src.more || new Map();
      src.more.set(e.res, outputRate(src, recipes.get(src.recipe), e.res));
    }
    if (!nodes.has(e.to)) continue;
    const edge = {...e, side:toEnd};
    edges.push(edge); src.outs.push(edge); nodes.get(e.to).ins.push(edge);
  }

        b = {w:a.w + b.w, z:(a.z*a.w + b.z*b.w) / (a.w + b.w), n:a.n.concat(b.n)};
      }
      blocks.push(b);
    });
    for (const b of blocks) for (const {v, off} of b.n) v.y = b.z + off;
  };
  cols.forEach(col => { let y = 0; col.forEach(v => { v.y = y; y += v.h + GAP_Y; }); });
  for (let it = 0; it < 40; it++) {
    const order = it % 2 ? cols : cols.slice().reverse();
    for (const col of order) {
      place(col, col.map(v => {
        if (v.node && chain.has(v.id)) return [0, 1000];
        if (v.src) return [v.src.y + v.src.h / 2 + 34 + v.h / 2, 6];
        if (!v.nb.length) return [v.y, .1];
        let s = 0, w = 0;
        for (const [o, k] of v.nb) { s += o.y*k; w += k; }
        return [s / w, w];
      }));
    }
  }

  // Coordinates: y here is the centre of the vertex.
  let x = 0;
  cols.forEach(col => {
    for (const v of col) {
      v.x = x;
      if (v.node) { v.node.x = x; v.node.y = v.y - v.h / 2; }
    }
    x += W + GAP_X;
  });
  for (const e of edges) e.via = e.via.map(d => ({x:d.x + W / 2, y:d.y}));
  for (const n of nodes.values()) {
    const p = pins.get(n.id);
    if (p) { n.x = p.x; n.y = p.y; }
  }
}

function bez(p0, c1, c2, p3, t){
  const u = 1 - t;
  return [u*u*u*p0[0] + 3*u*u*t*c1[0] + 3*u*t*t*c2[0] + t*t*t*p3[0], u*u*u*p0[1] + 3*u*u*t*c1[1] + 3*u*t*t*c2[1] + t*t*t*p3[1]];
}
function segments(points, shift){
  const out = [];
  for (let i = 0; i + 1 < points.length; i++) {
    const a = points[i], b = points[i + 1];
    const dx = b[0] > a[0] ? Math.max(36, (b[0] - a[0]) * .5) : 70;
    out.push([a, [a[0] + dx, a[1] + shift], [b[0] - dx, b[1] + shift], b]);
  }
  return out;
}
function polyline(segs){
  const pts = [];
  for (const s of segs) for (let i = 0; i <= 16; i++) pts.push(bez(s[0], s[1], s[2], s[3], i / 16));

}
const insideCard = (p, n, m) => p[0] > n.x - m && p[0] < n.x + W + m && p[1] > n.y - m && p[1] < n.y + n.h + m;
function renderEdges(){
  const nodes = [...G.nodes.values()], paths = [], arrows = [], labels = [], placed = [];
  const parallel = new Map();
  const list = G.edges.slice().sort((a, b) => (b.side - a.side) || (volume(a) - volume(b)));
  for (const e of list) {
    const key = e.from + '>' + e.to, idx = parallel.get(key) || 0;
    parallel.set(key, idx + 1);
    const a = G.nodes.get(e.from), b = G.nodes.get(e.to);
    const start = [a.x + W, a.y + a.h / 2], tip = [b.x, b.y + b.h / 2];
    const heft = Math.log10(volume(e) + 1);
    const len = e.side ? 11 : Math.min(21, 13 + heft * 2.4);
    const end = [tip[0] - len * .7, tip[1]];
    const shift = idx ? (idx % 2 ? 1 : -1) * Math.ceil(idx / 2) * 26 : 0;
    let segs = segments([start, end], shift);
    let pts = polyline(segs);
    const others = nodes.filter(n => n !== a && n !== b);
    if (e.via.length && pts.some(p => others.some(n => insideCard(p, n, 6)))) {
      segs = segments([start, ...e.via.map(v => [v.x, v.y]), end], shift);
      pts = polyline(segs);
    }
    const color = tint(iconColor(e.res));
    const width = e.side ? 1.4 : Math.min(3, 1.5 + heft * .55);
    const d = `M${segs[0][0][0]} ${segs[0][0][1]}` + segs.map(s => `C${s[1][0]} ${s[1][1]} ${s[2][0]} ${s[2][1]} ${s[3][0]} ${s[3][1]}`).join('');
    paths.push(`<path d="${d}" fill="none" stroke="${color}" stroke-width="${width.toFixed(2)}"${e.side ? ' stroke-dasharray="5 4"' : ''}/>`);
    const hw = len * .56;
    arrows.push(`<polygon points="${tip[0]},${tip[1]} ${tip[0] - len},${tip[1] - hw} ${tip[0] - len},${tip[1] + hw}" fill="${color}"/>`);
    // The label takes the first free spot around the middle of the curve.
    let spot = pts[Math.floor(pts.length / 2)];
    for (const t of [.5, .42, .58, .34, .66, .26, .74, .18, .82]) {
      const p = pts[Math.floor(pts.length * t)];
      const clear = !nodes.some(n => insideCard([p[0], p[1] + 8], n, 26)) && !placed.some(q => Math.abs(q[0] - p[0]) < 62 && Math.abs(q[1] - p[1]) < 36);
      if (clear) { spot = p; break; }
    }
    placed.push(spot);
    const txt = fmt(e.per_minute) + (unit(e.res) ? ' ' + unit(e.res) : '') + (e.side ? ' (побочн.)' : '');
    const t = e.transport;
    const extra = t ? [t.stack > 1 ? 'по ' + t.stack : '', t.belts > 1 ? 'лент: ' + t.belts : '', S.belt ? fmt(t.belt_rpm) + ' RPM' : ''].filter(Boolean).join(', ') : '';
    labels.push(`<div class="elabel" data-edge="${esc(edgeKey(e))}" style="left:${spot[0]}px;top:${spot[1]}px" title="${esc(nameOf(e.res))}">${itemIcon(e.res, 17)}<span class="n">${txt}</span>${extra ? `<span class="n t${t.needs_buffer ? ' warn' : ''}">${extra}</span>` : ''}</div>`);
  }

}
function applyView(){

function fit(){
  const ns = [...G.nodes.values()];
  if (!ns.length) return;
  const x0 = Math.min(...ns.map(n => n.x)), x1 = Math.max(...ns.map(n => n.x + W));
  const y0 = Math.min(...ns.map(n => n.y)), y1 = Math.max(...ns.map(n => n.y + n.h));

// What a change would do to the raw resources and the stress, compared with the current plan.
function planDiff(before, after){
  const sources = p => {
    const map = new Map();
    for (const n of p.nodes) if (n.type === 'gather' || n.type === 'generate') map.set(n.res, n.per_minute);
    return map;
  };
  const was = sources(before), now = sources(after);
  const added = [...now].filter(([r]) => !was.has(r));
  const changed = [...now].filter(([r, v]) => was.has(r) && Math.abs(v - was.get(r)) > 1e-6).map(([r, v]) => [r, was.get(r), v]);
  const gone = [...was].filter(([r]) => !now.has(r));
  return {added, changed, gone, suBefore:before.total_su, suAfter:after.total_su, any:added.length + changed.length + gone.length > 0 || Math.abs(before.total_su - after.total_su) > 1e-6};
}
function diffHtml(d){
  const rows = list => list.map(([r, v]) => `<div class="row">${itemIcon(r, 18)}<span>${esc(nameOf(r))}</span><span class="v">${rateText(r, v)}</span></div>`).join('');
  let h = '';
  if (d.added.length) h += `<h3>Новые ресурсы</h3>${rows(d.added)}`;
  if (d.changed.length) h += `<h3>Изменится</h3>` + d.changed.map(([r, a, b]) => `<div class="row">${itemIcon(r, 18)}<span>${esc(nameOf(r))}</span><span class="d">${rateText(r, a)}</span><span class="v">${rateText(r, b)}</span></div>`).join('');
  if (d.gone.length) h += `<h3>Больше не нужно</h3>${rows(d.gone)}`;
  return h + `<h3>Нагрузка</h3><div class="row"><span>${fmt(d.suBefore)} SU</span><span class="v p">${fmt(d.suAfter)} SU</span></div>`;
}

  h += `<div class="row"><span>Хватит одной от</span><span class="v">${fmt(t.min_belt_rpm)} RPM</span></div>`;
  h += `<div class="row"><span>Воронок на загрузку</span><span class="v p">${t.funnels}</span></div>`;
  if (t.needs_buffer) h += `<div class="note warn">Источник отдаёт меньше стопки за раз, а на ленте стопки сами не собираются. Нужен ящик и воронка с фильтром на ${t.stack} шт.</div>`;
  if (S.stacks[e.res]) h += `<div class="btns"><button class="btn" id="eReset">Сбросить</button></div>`;
  return h;
}
function bindEdgePanel(e){
  const seg = $('eStack');
  if (seg) seg.addEventListener('click', ev => { const v = +ev.target.dataset.v; if (v) { S.stacks[e.res] = v; replan(); } });
  const reset = $('eReset');
  if (reset) reset.addEventListener('click', () => { delete S.stacks[e.res]; replan(); });
}

/* ---------- Canvas interaction ---------- */
function bindCanvas(){
  const cv = $('canvas');
  const CLICK_MS = 300;
  let drag = null, pressedAt = 0;
  cv.addEventListener('pointerdown', e => {
    if (e.button !== 0 && e.button !== 1) return;
    const card = e.target.closest('.node');
    const n = card && G.nodes.get(card.dataset.id);
    const label = e.target.closest('.elabel');
    pressedAt = performance.now();
    drag = n ? {n, sx:e.clientX, sy:e.clientY, ox:n.x, oy:n.y, moved:false, rc:!!e.target.closest('[data-rc]')}
             : {pan:true, edge:label && label.dataset.edge, sx:e.clientX, sy:e.clientY, ox:view.x, oy:view.y, moved:false};
    cv.setPointerCapture(e.pointerId);
    if (!n) cv.classList.add('pan');
  });
  cv.addEventListener('pointermove', e => {
    if (!drag) return;
    const dx = e.clientX - drag.sx, dy = e.clientY - drag.sy;
    if (!drag.moved && Math.hypot(dx, dy) < 5) return;
    drag.moved = true;
    if (drag.pan) { view.x = drag.ox + dx; view.y = drag.oy + dy; applyView(); return; }
    const n = drag.n;
    n.x = drag.ox + dx / view.k; n.y = drag.oy + dy / view.k;
    pins.set(n.id, {x:n.x, y:n.y});
    n.el.style.left = n.x + 'px'; n.el.style.top = n.y + 'px';
    renderEdges();
  });
  const up = () => {
    if (!drag) return;
    cv.classList.remove('pan');
    // A long press means the user meant to move it and changed their mind, so nothing opens.
    if (!drag.moved && performance.now() - pressedAt < CLICK_MS) { if (drag.n) openNode(drag.n.id, drag.rc); else if (drag.edge) openEdge(drag.edge); else if (panel) closePanel(); }
    drag = null;
  };
  cv.addEventListener('pointerup', up);
  cv.addEventListener('pointercancel', up);
  cv.addEventListener('wheel', e => { e.preventDefault(); zoomAt(e.clientX, e.clientY, Math.exp(-e.deltaY * .0012)); }, {passive:false});
  $('zIn').onclick = () => zoomAt(innerWidth / 2, innerHeight / 2, 1.2);
  $('zOut').onclick = () => zoomAt(innerWidth / 2, innerHeight / 2, 1 / 1.2);
  $('zFit').onclick = fit;
}

/* ---------- Controls ---------- */
function setTarget(id, name){
  S.item = id; S.itemName = name;
  S.stock = []; S.choice = {}; S.overrides = {};
  pins.clear(); panel = null;
  syncControls();
  replan({fit:true});
}
function syncControls(){
  const name = S.itemName || nameOf(S.item);
  $('search').value = name;
  $('searchIcon').innerHTML = icon(S.item, name, 20);
  $('per').value = S.per; $('rpm').value = S.rpm; $('belt').value = S.belt ?? ''; $('belt').placeholder = S.rpm; $('heat').checked = S.heat;
  document.querySelectorAll('#mode button').forEach(b => b.classList.toggle('on', b.dataset.v === S.mode));
}
function bindControls(){
  const input = $('search'), box = $('sugg');
  let timer = 0, list = [], active = 0;
  const hide = () => { box.style.display = 'none'; };
  const paint = () => {
    box.innerHTML = list.map((it, i) => `<div class="${i === active ? 'on' : ''}" data-i="${i}">${icon(it.id, it.name, 20)}<span>${esc(it.name === it.id ? readable(it.id) : it.name)}</span><small>${esc(it.id.split(':')[0])}</small></div>`).join('');
    box.style.display = list.length ? 'block' : 'none';
    const on = box.querySelector('.on');
    if (on) on.scrollIntoView({block:'nearest'});
  };
  // Names show in English, but a Russian query must still find the item.
  const query = q => {
    const url = lang => api(`/api/items?lang=${lang}&limit=14&q=${encodeURIComponent(q.trim())}`);
    return Promise.all([url('en'), url('ru')]).then(([en, ru]) => {
      const seen = new Set(en.map(i => i.id));
      list = en.concat(ru.filter(i => !seen.has(i.id)).map(i => items.get(i.id) || i)).slice(0, 14);
      active = 0; paint();
    }).catch(() => { list = []; hide(); });
  };
  input.addEventListener('focus', () => { input.select(); query(''); });
  input.addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(() => query(input.value), 130); });
  input.addEventListener('keydown', e => {
    if (e.key === 'ArrowDown' && list.length) { active = (active + 1) % list.length; paint(); e.preventDefault(); }
    else if (e.key === 'ArrowUp' && list.length) { active = (active - 1 + list.length) % list.length; paint(); e.preventDefault(); }
    else if (e.key === 'Enter' && list[active]) { const it = list[active]; hide(); input.blur(); setTarget(it.id, it.name); }
    else if (e.key === 'Escape') { hide(); input.blur(); syncControls(); }
  });
  box.addEventListener('pointerdown', e => {
    const row = e.target.closest('[data-i]');
    if (!row) return;
    e.preventDefault();
    const it = list[+row.dataset.i]; hide(); input.blur(); setTarget(it.id, it.name);
  });
  input.addEventListener('blur', () => { setTimeout(hide, 100); syncControls(); });
  let numTimer = 0;
  const num = (id, key) => $(id).addEventListener('input', e => {
    const v = parseFloat(e.target.value);
    if (!(v > 0)) return;
    S[key] = v;
    clearTimeout(numTimer); numTimer = setTimeout(() => replan(), 250);
  });
  num('per', 'per'); num('rpm', 'rpm');
  $('belt').addEventListener('input', e => {
    const v = parseFloat(e.target.value);
    S.belt = v > 0 ? v : null;
    clearTimeout(numTimer); numTimer = setTimeout(() => replan(), 250);
  });
  $('mode').addEventListener('click', e => { const v = e.target.dataset.v; if (v && v !== S.mode) { S.mode = v; syncControls(); replan(); } });
  $('heat').addEventListener('change', e => { S.heat = e.target.checked; replan(); });
  $('totals').addEventListener('click', () => { if (panel && panel.kind === 'load') closePanel(); else { panel = {kind:'load'}; renderPanel(); } });
  $('jeiBtn').addEventListener('click', () => { if (panel && panel.kind === 'item') closePanel(); else openItem(S.item, 'made'); });
  $('close').addEventListener('click', closePanel);
  addEventListener('keydown', e => { if (e.key === 'Escape' && panel && document.activeElement !== input) closePanel(); });
}

/* ---------- Start. The hash can preset a scenario: #item=...&per=...&rpm=...&mode=...&open=<node id>&panel=load ---------- */
async function start(){
  const h = new URLSearchParams(location.hash.slice(1));
  if (h.get('item')) S.item = h.get('item');
  if (h.get('per')) S.per = +h.get('per');
  if (h.get('rpm')) S.rpm = +h.get('rpm');
  if (h.get('mode')) S.mode = h.get('mode');
  if (h.get('heat') === '0') S.heat = false;
  if (h.get('belt')) S.belt = +h.get('belt');
  if (h.get('stack')) S.stacks = JSON.parse(h.get('stack'));
  bindCanvas(); bindControls(); bindSide(); syncControls(); applyView(); await loadDefaults();
  await replan({fit:true});
  syncControls();
  if (h.get('open')) openNode(h.get('open'));
  if (h.get('edge')) openEdge(h.get('edge'));
  if (h.get('panel') === 'load') { panel = {kind:'load'}; renderPanel(); }
  if (h.get('settings')) { $('sSet').open = true; $('sMat').open = false; }
}
start();
</script>
